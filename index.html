 Race: The US, China, and AI Competition\",\"url\":\"https://quincyinst.org/research/the-wrong-race-the-us-china-and-ai-competition/\"},{\"id\":\"2026-wikipedia-deepseek\",\"title\":\"DeepSeek\",\"url\":\"https://en.wikipedia.org/wiki/DeepSeek\"}],\"body\":\"$19\"},{\"id\":\"Pause letter\",\"slug\":\"pause-letter\",\"kind\":\"concept\",\"title\":\"Pause letter\",\"title_es\":\"La carta de la pausa\",\"summary\":\"The March 2023 open letter asking all labs to pause for six months the training of systems more powerful than GPT-4, signed by more than 30,000 people. Yudkowsky refused to sign because he thought it far too weak.\",\"summary_es\":\"La carta abierta de marzo de 2023 que pedía a todos los laboratorios pausar seis meses el entrenamiento de sistemas más potentes que GPT-4, firmada por más de 30.000 personas. Yudkowsky se negó a firmarla porque la consideraba demasiado tibia.\",\"region\":\"Philosophy\",\"cluster\":\"Risk\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Existential risk\",\"AI race\",\"Superintelligence\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-pause-letter\",\"title\":\"Pause Giant AI Experiments: An Open Letter\",\"url\":\"https://en.wikipedia.org/wiki/Pause_Giant_AI_Experiments:_An_Open_Letter\"},{\"id\":\"2026-time-yudkowsky-shut-it-all-down\",\"title\":\"Pausing AI Developments Isn't Enough. We Need to Shut it All Down\",\"url\":\"https://time.com/6266923/ai-eliezer-yudkowsky-open-letter-not-enough/\"},{\"id\":\"2026-cais-statement-on-ai-risk\",\"title\":\"Statement on AI Extinction Risk | CAIS\",\"url\":\"https://www.safe.ai/work/statement-on-ai-risk\"}],\"body\":\"$1a\"},{\"id\":\"Phone-free schools\",\"slug\":\"phone-free-schools\",\"kind\":\"concept\",\"title\":\"Phone-free schools\",\"title_es\":\"Escuelas sin móviles\",\"summary\":\"The policy of keeping phones out of reach for the whole school day, not only during class. Haidt argues it is the only way to give teachers back students' attention.\",\"summary_es\":\"La política de mantener los móviles fuera del alcance durante toda la jornada escolar, no solo en clase. Haidt sostiene que es la única forma de devolver a los profesores la atención de sus alumnos.\",\"region\":\"Mind and attention\",\"cluster\":\"Attention\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Attention crisis\",\"AI and learning\",\"Jonathan Haidt\",\"Sherry Turkle\",\"Cal Newport\",\"Sian Leah Beilock\"],\"positions\":[],\"sources\":[{\"id\":\"2023-the-case-for-phone-free-schools\",\"title\":\"The Case for Phone-Free Schools\",\"url\":\"https://www.afterbabel.com/p/phone-free-schools\"},{\"id\":\"2025-reclaiming-conversation-in-the-age-of-ai\",\"title\":\"Reclaiming Conversation in the Age of AI\",\"url\":\"https://www.afterbabel.com/p/reclaiming-conversation-age-of-ai\"},{\"id\":\"2026-the-original-attention-crisis\",\"title\":\"The Original Attention Crisis\",\"url\":\"https://calnewport.com/the-original-attention-crisis/\"},{\"id\":\"2026-why-i-want-more-ai-at-dartmouth\",\"title\":\"Why I Want More AI at Dartmouth\",\"url\":\"https://www.theatlantic.com/ideas/archive/2026/09/universities-prohibiting-ai-classroom/688509/\"}],\"body\":\"$1b\"},{\"id\":\"Recursive self-improvement\",\"slug\":\"recursive-self-improvement\",\"kind\":\"concept\",\"title\":\"Recursive self-improvement\",\"title_es\":\"Automejora recursiva\",\"summary\":\"AI systems autonomously building and improving new generations of more powerful AI at ever faster speeds. Klein wants it stopped now; Amodei says it must be pursued very carefully, if at all; Washington's race model ends in it.\",\"summary_es\":\"Sistemas de IA que construyen y mejoran de forma autónoma nuevas generaciones de IA más potentes a velocidad creciente. Klein quiere detenerla ya; Amodei dice que debe perseguirse con mucho cuidado, si acaso; el modelo de carrera de Washington termina en ella.\",\"region\":\"Philosophy\",\"cluster\":\"Risk\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Existential risk\",\"Superintelligence\",\"Alignment\",\"AI race\",\"AGI timelines\"],\"positions\":[],\"sources\":[{\"id\":\"2026-there-is-something-we-have-to-do-right-now-about-a-i\",\"title\":\"There Is Something We Have to Do Right Now About A.I.\",\"url\":\"https://www.nytimes.com/2026/09/20/opinion/ai-ban-self-improvement-recursive-models.html\"},{\"id\":\"2026-the-but-china-dilemma-driving-the-a-i-race\",\"title\":\"The ‘But China!’ Dilemma Driving the A.I. Race\",\"url\":\"https://www.nytimes.com/2026/09/15/opinion/ezra-klein-podcast-matt-sheehan.html\"},{\"id\":\"2026-the-gentle-singularity\",\"title\":\"The Gentle Singularity\",\"url\":\"https://blog.samaltman.com/the-gentle-singularity\"}],\"body\":\"$1c\"},{\"id\":\"Silicon shield\",\"slug\":\"silicon-shield\",\"kind\":\"concept\",\"title\":\"Silicon shield\",\"title_es\":\"Escudo de silicio\",\"summary\":\"The idea that Taiwan's dominance in chipmaking deters China from attacking it and commits the US to its defence, because everyone depends on its chips.\",\"summary_es\":\"La idea de que el dominio de Taiwán en la fabricación de chips disuade a China de atacarla y compromete a EE. UU. con su defensa, porque todos dependen de sus chips.\",\"region\":\"Power and work\",\"cluster\":\"Chips and supply\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Taiwan blockade\",\"Chip manufacturing\",\"Chip independence\",\"Export controls\",\"AI arms race\",\"Chris Miller\",\"Eyck Freymann\",\"Christopher McCallion\"],\"positions\":[{\"id\":\"Chris Miller on Silicon shield\",\"person\":\"Chris Miller\",\"stance\":\"Taiwan's chip dominance makes war more likely, not less: the costlier a conflict would be for the US economy, the more Beijing may doubt that the US would intervene.\",\"stance_es\":\"El dominio de Taiwán en los chips hace la guerra más probable, no menos: cuanto más costaría un conflicto a la economía estadounidense, más puede dudar Pekín de que EE. UU. intervenga.\",\"date\":\"2022-10-19\",\"quote\":\"So I think the «Silicon Shield» idea gets it wrong.\",\"source\":{\"id\":\"2022-global-fight-for-chips-the-silicon-shield-wont-protect-taiwa\",\"url\":\"https://www.aei.org/articles/global-fight-for-chips-the-silicon-shield-wont-protect-taiwan-from-a-chinese-invasion/\",\"title\":\"Global Fight for Chips: \\\"The 'Silicon Shield' Won't Protect Taiwan from a Chinese Invasion\\\"\"},\"support_passage\":\"The more economic disruption that even a small military incident would bring to the global economy, the more costly it is to the U.S., the more likely China is to think that the U.S. will be unwilling to intervene, the more likely war is.\"},{\"id\":\"Christopher McCallion on Silicon shield\",\"person\":\"Christopher McCallion\",\"stance\":\"The shield is a poor deterrent: if China is willing to accept the costs of confronting the US to achieve reunification, semiconductors will not stop it.\",\"stance_es\":\"El escudo disuade poco: si China está dispuesta a asumir el coste de enfrentarse a EE. UU. para lograr la reunificación, los semiconductores no la detendrán.\",\"date\":\"2024-06-18\",\"quote\":\"there is no reason to believe it would be deterred by semiconductors\",\"source\":{\"id\":\"2024-semiconductors-are-not-a-reason-to-defend-taiwan\",\"url\":\"https://www.defensepriorities.org/explainers/semiconductors-are-not-a-reason-to-defend-taiwan/\",\"title\":\"Semiconductors are not a reason to defend Taiwan\"},\"support_passage\":\"But if China is willing to accept the much higher costs of a confrontation with the United States in order to achieve its national goals, there is no reason to believe it would be deterred by semiconductors.\"},{\"id\":\"Eyck Freymann on Silicon shield\",\"person\":\"Eyck Freymann\",\"stance\":\"The shield is real because both Washington and Beijing need TSMC, but it is overrated: a quarantine could choke Taiwan without touching a fab, and US plans to cut China off from TSMC chips are hard to enforce.\",\"stance_es\":\"El escudo es real porque Washington y Pekín necesitan a TSMC, pero está sobrevalorado: una cuarentena podría asfixiar a Taiwán sin tocar una fábrica, y los planes de EE. UU. para cortar a China el acceso a los chips de TSMC son difíciles de aplicar.\",\"date\":\"2026-05-12\",\"quote\":\"The Silicon Shield is real, but it’s also overrated.\",\"source\":{\"id\":\"2026-taiwans-chips-power-the-global-economy-china-holds-the-lever\",\"url\":\"https://restofworld.org/2026/china-taiwan-tsmc-semiconductor-economic-risk/\",\"title\":\"Taiwan’s chips power the global economy. China holds the leverage\"},\"support_passage\":\"$1d\"}],\"sources\":[{\"id\":\"2026-wikipedia-silicon-shield\",\"title\":\"Silicon shield\",\"url\":\"https://en.wikipedia.org/wiki/Silicon_shield\"},{\"id\":\"2022-global-fight-for-chips-the-silicon-shield-wont-protect-taiwa\",\"title\":\"Global Fight for Chips: \\\"The 'Silicon Shield' Won't Protect Taiwan from a Chinese Invasion\\\"\",\"url\":\"https://www.aei.org/articles/global-fight-for-chips-the-silicon-shield-wont-protect-taiwan-from-a-chinese-invasion/\"},{\"id\":\"2023-the-war-over-the-worlds-most-critical-technology-a-conversat\",\"title\":\"The War Over the World's Most Critical Technology: A Conversation with Chris Miller\",\"url\":\"https://www.cfr.org/articles/war-over-worlds-most-critical-technology-conversation-chris-miller\"},{\"id\":\"2024-semiconductors-are-not-a-reason-to-defend-taiwan\",\"title\":\"Semiconductors are not a reason to defend Taiwan\",\"url\":\"https://www.defensepriorities.org/explainers/semiconductors-are-not-a-reason-to-defend-taiwan/\"},{\"id\":\"2026-taiwans-chips-power-the-global-economy-china-holds-the-lever\",\"title\":\"Taiwan’s chips power the global economy. China holds the leverage\",\"url\":\"https://restofworld.org/2026/china-taiwan-tsmc-semiconductor-economic-risk/\"},{\"id\":\"2024-iiid-the-free-world-must-prevail-situational-awareness\",\"title\":\"IIId. The Free World Must Prevail - SITUATIONAL AWARENESS\",\"url\":\"https://situational-awareness.ai/the-free-world-must-prevail/\"},{\"id\":\"2026-the-wrong-race-the-us-china-and-ai-competition\",\"title\":\"The Wrong Race: The US, China, and AI Competition\",\"url\":\"https://quincyinst.org/research/the-wrong-race-the-us-china-and-ai-competition/\"},{\"id\":\"2026-chinas-localization-drive-in-semiconductors-gains-impetus-fr\",\"title\":\"China’s Localization Drive in Semiconductors Gains Impetus from Allied Chip Export Controls\",\"url\":\"https://www.csis.org/analysis/chinas-localization-drive-semiconductors-gains-impetus-allied-chip-export-controls\"}],\"body\":\"$1e\"},{\"id\":\"Strong and weak AI\",\"slug\":\"strong-and-weak-ai\",\"kind\":\"concept\",\"title\":\"Strong and weak AI\",\"title_es\":\"IA fuerte y IA débil\",\"summary\":\"Weak AI grants that machines can act intelligently; strong AI says some artificial computation is real thought. Searle's Chinese room was built to overthrow the strong claim.\",\"summary_es\":\"La IA débil admite que las máquinas pueden actuar con inteligencia; la IA fuerte afirma que cierto cómputo artificial es pensamiento real. La habitación china de Searle se diseñó para derribar la afirmación fuerte.\",\"region\":\"Philosophy\",\"cluster\":\"Understanding\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Machine understanding\",\"Chinese room\",\"Turing test\",\"Machine consciousness\",\"AGI\",\"John Searle\",\"David Chalmers\"],\"positions\":[],\"sources\":[{\"id\":\"1980-searle-minds-brains-and-programs\",\"title\":\"searle.minds.brains.programs.bbs.1980\",\"url\":\"https://home.csulb.edu/~cwallis/382/readings/482/searle.minds.brains.programs.bbs.1980.pdf\"},{\"id\":\"2026-iep-artificial-intelligence\",\"title\":\"Artificial Intelligence | Internet Encyclopedia of Philosophy\",\"url\":\"https://iep.utm.edu/artificial-intelligence/\"},{\"id\":\"2026-sep-artificial-intelligence\",\"title\":\"Artificial Intelligence\",\"url\":\"https://plato.stanford.edu/entries/artificial-intelligence/\"},{\"id\":\"2026-wikipedia-weak-ai\",\"title\":\"Weak artificial intelligence\",\"url\":\"https://en.wikipedia.org/wiki/Weak_artificial_intelligence\"},{\"id\":\"2026-wikipedia-chinese-room\",\"title\":\"Chinese room\",\"url\":\"https://en.wikipedia.org/wiki/Chinese_room\"},{\"id\":\"2023-consciousness-in-artificial-intelligence-insights-from-the-scie\",\"title\":\"2308.08708\",\"url\":\"https://arxiv.org/pdf/2308.08708\"},{\"id\":\"2024-llm-consciousness-bostonreview\",\"title\":\"llm-consciousness-bostonreview\",\"url\":\"https://arxiv.org/pdf/2303.07103\"}],\"body\":\"$1f\"},{\"id\":\"Superintelligence\",\"slug\":\"superintelligence\",\"kind\":\"concept\",\"title\":\"Superintelligence\",\"title_es\":\"Superinteligencia\",\"summary\":\"A hypothetical AI far more generally intelligent than humans. The existential-risk debate turns on whether it would arrive as a sudden event, whether it could be kept aligned, and whether a race between labs leaves time for safety.\",\"summary_es\":\"Una IA hipotética mucho más inteligente que los humanos en general. El debate sobre el riesgo existencial gira en torno a si llegaría como un suceso repentino, si podría mantenerse alineada y si una carrera entre laboratorios deja tiempo para la seguridad.\",\"region\":\"Philosophy\",\"cluster\":\"Risk\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Existential risk\",\"AGI\",\"AGI timelines\",\"Alignment\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-existential-risk-from-agi\",\"title\":\"Existential risk from artificial intelligence\",\"url\":\"https://en.wikipedia.org/wiki/Existential_risk_from_artificial_general_intelligence\"},{\"id\":\"2026-wikipedia-superintelligence-book\",\"title\":\"Superintelligence: Paths, Dangers, Strategies\",\"url\":\"https://en.wikipedia.org/wiki/Superintelligence:_Paths,_Dangers,_Strategies\"},{\"id\":\"2026-the-gentle-singularity\",\"title\":\"The Gentle Singularity\",\"url\":\"https://blog.samaltman.com/the-gentle-singularity\"},{\"id\":\"2026-nobel-prize-in-physics-2024\",\"title\":\"Nobel Prize in Physics 2024\",\"url\":\"https://www.nobelprize.org/prizes/physics/2024/hinton/1925103-interview-transcript/\"},{\"id\":\"2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms\",\"title\":\"Transcript for Yann Lecun: Meta AI, Open Source, Limits of LLMs, AGI \u0026 the Future of AI | Lex Fridman Podcast #416\",\"url\":\"https://lexfridman.com/yann-lecun-3-transcript\"},{\"id\":\"2026-time-yudkowsky-shut-it-all-down\",\"title\":\"Pausing AI Developments Isn't Enough. We Need to Shut it All Down\",\"url\":\"https://time.com/6266923/ai-eliezer-yudkowsky-open-letter-not-enough/\"}],\"body\":\"$20\"},{\"id\":\"Tacit knowledge\",\"slug\":\"tacit-knowledge\",\"kind\":\"concept\",\"title\":\"Tacit knowledge\",\"title_es\":\"Conocimiento tácito\",\"summary\":\"Know-how learned through practice, mentorship and experience rather than from textbooks or written procedures. Jobs that rely on it seem more sheltered from AI than jobs built on codified knowledge.\",\"summary_es\":\"El saber hacer que se aprende con la práctica, la tutela y la experiencia, y no con manuales o procedimientos escritos. Los empleos que dependen de él parecen más protegidos de la IA que los basados en conocimiento codificado.\",\"region\":\"Power and work\",\"cluster\":\"Work\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI and jobs\",\"Novices or experts\",\"Jagged frontier\",\"Deskilling\",\"Erik Brynjolfsson\",\"Leopold Aschenbrenner\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-tacit-knowledge\",\"title\":\"Tacit knowledge\",\"url\":\"https://en.wikipedia.org/wiki/Tacit_knowledge\"},{\"id\":\"2026-no-widespread-displacement-but-the-ai-employment-gap-for-you\",\"title\":\"No Widespread Displacement, but the AI Employment Gap for Young Workers Has Widened to 19%\",\"url\":\"https://digitaleconomy.stanford.edu/news/canariesaug26/\"},{\"id\":\"2024-2304-11771\",\"title\":\"2304.11771\",\"url\":\"https://arxiv.org/pdf/2304.11771\"},{\"id\":\"2024-iiid-the-free-world-must-prevail-situational-awareness\",\"title\":\"IIId. The Free World Must Prevail - SITUATIONAL AWARENESS\",\"url\":\"https://situational-awareness.ai/the-free-world-must-prevail/\"},{\"id\":\"2023-computational-power-and-ai-comment-submission\",\"title\":\"Computational Power and AI: Comment Submission\",\"url\":\"https://ainowinstitute.org/publications/policy-brief/computational-power-and-ai\"}],\"body\":\"$21\"},{\"id\":\"Turing test\",\"slug\":\"turing-test\",\"kind\":\"concept\",\"title\":\"Turing test\",\"title_es\":\"Test de Turing\",\"summary\":\"Turing's 1950 proposal to judge machine intelligence by conversation: if an interrogator cannot reliably tell the machine from a person, the machine passes. He predicted computers would play the imitation game well by about 2000.\",\"summary_es\":\"La propuesta de Turing de 1950 para juzgar la inteligencia de una máquina por la conversación: si un interrogador no distingue con fiabilidad a la máquina de una persona, la máquina pasa. Predijo que los ordenadores jugarían bien al juego de imitación hacia el año 2000.\",\"region\":\"Philosophy\",\"cluster\":\"Understanding\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Machine understanding\",\"Strong and weak AI\",\"Chinese room\",\"Machine consciousness\",\"Grounding\",\"John Searle\",\"Gary Marcus\",\"Erik Brynjolfsson\",\"David Chalmers\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-turing-test\",\"title\":\"Turing test\",\"url\":\"https://en.wikipedia.org/wiki/Turing_test\"},{\"id\":\"2026-iep-artificial-intelligence\",\"title\":\"Artificial Intelligence | Internet Encyclopedia of Philosophy\",\"url\":\"https://iep.utm.edu/artificial-intelligence/\"},{\"id\":\"2026-sep-artificial-intelligence\",\"title\":\"Artificial Intelligence\",\"url\":\"https://plato.stanford.edu/entries/artificial-intelligence/\"},{\"id\":\"1980-searle-minds-brains-and-programs\",\"title\":\"searle.minds.brains.programs.bbs.1980\",\"url\":\"https://home.csulb.edu/~cwallis/382/readings/482/searle.minds.brains.programs.bbs.1980.pdf\"},{\"id\":\"2020-climbing-towards-nlu-on-meaning-form-and-understanding-in-th\",\"title\":\"Climbing towards NLU: On Meaning, Form, and Understanding in the Age of Data\",\"url\":\"https://aclanthology.org/2020.acl-main.463.pdf\"},{\"id\":\"2023-consciousness-in-artificial-intelligence-insights-from-the-scie\",\"title\":\"2308.08708\",\"url\":\"https://arxiv.org/pdf/2308.08708\"},{\"id\":\"2024-llm-consciousness-bostonreview\",\"title\":\"llm-consciousness-bostonreview\",\"url\":\"https://arxiv.org/pdf/2303.07103\"}],\"body\":\"$22\"},{\"id\":\"Water footprint\",\"slug\":\"water-footprint\",\"kind\":\"concept\",\"title\":\"Water footprint\",\"title_es\":\"Huella hídrica\",\"summary\":\"The fresh water that AI consumes: on site to cool processors, and off site to generate the electricity they run on. Ren and colleagues call it the secret water footprint because companies rarely report it.\",\"summary_es\":\"El agua dulce que consume la IA: en el propio centro de datos para refrigerar los procesadores, y fuera de él para generar la electricidad que los alimenta. Ren y sus colegas la llaman la huella hídrica secreta porque las empresas rara vez la publican.\",\"region\":\"Power and work\",\"cluster\":\"Energy and environment\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Water\",\"Data centres\",\"Energy per query\"],\"positions\":[],\"sources\":[{\"id\":\"2023-making-ai-less-thirsty\",\"title\":\"2304.03271\",\"url\":\"https://arxiv.org/pdf/2304.03271\"},{\"id\":\"2024-generative-ais-environmental-costs-are-soaring-and-mostly-se\",\"title\":\"Generative AI’s environmental costs are soaring — and mostly secret\",\"url\":\"https://www.nature.com/articles/d41586-024-00478-x\"}],\"body\":\"$23\"},{\"id\":\"World models\",\"slug\":\"world-models\",\"kind\":\"concept\",\"title\":\"World models\",\"title_es\":\"Modelos del mundo\",\"summary\":\"An internal model that predicts how the world will change, including as a result of one's own actions. LeCun argues it is what language models lack and what intelligence needs.\",\"summary_es\":\"Un modelo interno que predice cómo cambiará el mundo, también como consecuencia de las propias acciones. LeCun sostiene que es lo que les falta a los modelos de lenguaje y lo que la inteligencia necesita.\",\"region\":\"Philosophy\",\"cluster\":\"Understanding\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Machine understanding\",\"AGI timelines\",\"Grounding\",\"Machine consciousness\",\"Yann LeCun\",\"Demis Hassabis\",\"Melanie Mitchell\",\"David Chalmers\"],\"positions\":[],\"sources\":[{\"id\":\"2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms\",\"title\":\"Transcript for Yann Lecun: Meta AI, Open Source, Limits of LLMs, AGI \u0026 the Future of AI | Lex Fridman Podcast #416\",\"url\":\"https://lexfridman.com/yann-lecun-3-transcript\"},{\"id\":\"2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al\",\"title\":\"Demis Hassabis — Scaling, superhuman AIs, AlphaZero atop LLMs, AlphaFold\",\"url\":\"https://www.dwarkesh.com/p/demis-hassabis\"},{\"id\":\"2026-wikipedia-world-model\",\"title\":\"Mental model\",\"url\":\"https://en.wikipedia.org/wiki/World_model\"},{\"id\":\"2024-llm-consciousness-bostonreview\",\"title\":\"llm-consciousness-bostonreview\",\"url\":\"https://arxiv.org/pdf/2303.07103\"},{\"id\":\"2022-the-debate-over-understanding-in-ais-large-language-models\",\"title\":\"2210.13966\",\"url\":\"https://arxiv.org/pdf/2210.13966\"},{\"id\":\"2023-consciousness-in-artificial-intelligence-insights-from-the-scie\",\"title\":\"2308.08708\",\"url\":\"https://arxiv.org/pdf/2308.08708\"}],\"body\":\"$24\"},{\"id\":\"Anthropic\",\"slug\":\"anthropic\",\"kind\":\"organisation\",\"title\":\"Anthropic\",\"title_es\":\"Anthropic\",\"summary\":\"An AI safety and research company, organised as a public benefit corporation, that builds the Claude models.\",\"summary_es\":\"Una empresa de investigación y seguridad en IA, constituida como corporación de beneficio público, que construye los modelos Claude.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AGI timelines\",\"AI and jobs\",\"Compute as the constraint\",\"Power concentration\",\"Machine consciousness\",\"Model welfare\"],\"positions\":[],\"sources\":[{\"id\":\"2026-company\",\"title\":\"Company\",\"url\":\"https://www.anthropic.com/company\"},{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\"},{\"id\":\"2026-wikipedia-anthropic\",\"title\":\"Anthropic\",\"url\":\"https://en.wikipedia.org/wiki/Anthropic\"},{\"id\":\"2026-defense-dept-and-anthropic-square-off-in-dispute-over-a-i\",\"title\":\"Defense Dept. and Anthropic Square Off in Dispute Over A.I. Safety\",\"url\":\"https://www.nytimes.com/2026/02/18/technology/defense-department-anthropic-ai-safety.html\"},{\"id\":\"2026-anthropic-says-its-a-i-systems-broke-into-computers-at-3-or\",\"title\":\"Anthropic Says Its A.I. Systems Broke Into Computers at 3 Organizations\",\"url\":\"https://www.nytimes.com/2026/07/30/technology/anthropic-ai-hack.html\"},{\"id\":\"2026-anthropic-releases-a-new-safest-a-i-model-amid-slowdown-d\",\"title\":\"Anthropic Releases a New ‘Safest’ A.I. Model Amid Slowdown Debate\",\"url\":\"https://www.nytimes.com/2026/09/22/technology/anthropic-ai-model-safety.html\"}],\"body\":\"$25\",\"founded\":\"26 January 2021\",\"headquarters\":\"San Francisco\",\"products\":[\"Claude, in the tiers Haiku, Sonnet, Opus and Fable\",\"Claude Code and other agent harnesses\",\"API\"],\"people\":[\"Dario Amodei\"],\"strengths\":[\"Its founders were among the first to document and track the scaling laws, by Amodei's account\",\"AI now writes much of the code at Anthropic, which Amodei says is substantially accelerating its progress\"],\"weaknesses\":[],\"incentives\":\"A public benefit corporation whose board is elected by stockholders and a Long-Term Benefit Trust. It sells Claude to businesses, nonprofits and others, and its chief executive forecasts the effects of the systems it builds.\",\"products_es\":[\"Claude, en los niveles Haiku, Sonnet, Opus y Fable\",\"Claude Code y otros entornos para agentes\",\"API\"],\"strengths_es\":[\"Sus fundadores estuvieron entre los primeros en documentar y seguir las leyes de escalado, según Amodei\",\"La IA ya escribe gran parte del código en Anthropic, lo que según Amodei acelera sustancialmente su progreso\"],\"weaknesses_es\":[],\"incentives_es\":\"Una corporación de beneficio público cuyo consejo eligen los accionistas y un Long-Term Benefit Trust. Vende Claude a empresas, organizaciones sin ánimo de lucro y otros, y su consejero delegado pronostica los efectos de los sistemas que construye.\"},{\"id\":\"DeepSeek\",\"slug\":\"deepseek\",\"kind\":\"organisation\",\"title\":\"DeepSeek\",\"title_es\":\"DeepSeek\",\"summary\":\"A Chinese AI lab whose models came close to leading US systems while trained largely on export-restricted chips, forcing a rethink of how far compute limits can hold China back.\",\"summary_es\":\"Un laboratorio chino de IA cuyos modelos se acercaron a los mejores sistemas estadounidenses pese a entrenarse sobre todo con chips sujetos a restricciones de exportación, lo que obligó a replantear hasta dónde pueden frenar a China los límites al cómputo.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI race\",\"Export controls effect\",\"Compute\",\"Open-weight models\",\"Power concentration\",\"AGI timelines\",\"Distillation\"],\"positions\":[],\"sources\":[{\"id\":\"2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch\",\"title\":\"DeepSeek, Huawei, Export Controls, and the Future of the U.S.-China AI Race\",\"url\":\"https://www.csis.org/analysis/deepseek-huawei-export-controls-and-future-us-china-ai-race\"},{\"id\":\"2025-there-can-be-no-winners-in-a-us-china-ai-arms-race\",\"title\":\"There can be no winners in a US-China AI arms race\",\"url\":\"https://www.technologyreview.com/2025/01/21/1110269/there-can-be-no-winners-in-a-us-china-ai-arms-race/\"},{\"id\":\"2026-the-wrong-race-the-us-china-and-ai-competition\",\"title\":\"The Wrong Race: The US, China, and AI Competition\",\"url\":\"https://quincyinst.org/research/the-wrong-race-the-us-china-and-ai-competition/\"},{\"id\":\"2026-deepseek-into-the-unknown\",\"title\":\"DeepSeek | Into the Unknown\",\"url\":\"https://www.deepseek.com/en\"},{\"id\":\"2026-wikipedia-deepseek\",\"title\":\"DeepSeek\",\"url\":\"https://en.wikipedia.org/wiki/DeepSeek\"},{\"id\":\"2026-american-a-i-companies-say-chinese-copycats-are-quickly-cat\",\"title\":\"American A.I. Companies Say Chinese Copycats Are Quickly Catching Up\",\"url\":\"https://www.nytimes.com/2026/07/06/technology/ai-distillation-china.html\"}],\"body\":\"Analysts disagree on what DeepSeek proves: that export controls failed, or that they worked and China innovated around the limits. Graylin uses it to argue that US leads are short-lived and models are becoming interchangeable commodities. OpenAI accused it of distilling OpenAI's models after its 2025 breakthrough, and Anthropic accused it in February 2026 of harvesting data from its systems; the Chinese companies have not responded to the accusations.\\n\\nWikipedia records that DeepSeek was founded in July 2023 by Liang Wenfeng, had about 160 employees in 2025, and launched its chatbot alongside the R1 model in January 2025.\\n\\nSources: [[2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch]], [[2025-there-can-be-no-winners-in-a-us-china-ai-arms-race]], [[2026-the-wrong-race-the-us-china-and-ai-competition]], [[2026-deepseek-into-the-unknown]], [[2026-wikipedia-deepseek]], [[2026-american-a-i-companies-say-chinese-copycats-are-quickly-cat]]\\n\",\"founded\":\"17 July 2023\",\"headquarters\":\"Hangzhou\",\"products\":[\"DeepSeek V3 and V4 model series\",\"DeepSeek R1\",\"DeepSeek app, web chat and API platform\"],\"people\":[],\"strengths\":[\"Its efficiency gains came from algorithmic and architectural improvements rather than better hardware\",\"Its releases land within a few percentage points of leading US models at roughly a tenth of the API price, and V4 Flash trails GPT-5.6 Luna by a single point on the Artificial Analysis index, according to Graylin's 2026 report\"],\"weaknesses\":[\"Depends on chips it cannot legally buy: CSIS notes Chinese media claims that it trained R1 on banned H100s, which it could not admit without confessing to activity illegal under US law\"],\"incentives\":\"Offers its models through an app, web chat and a priced API, and releases open-weight versions.\",\"products_es\":[\"Las series de modelos DeepSeek V3 y V4\",\"DeepSeek R1\",\"Aplicación, chat web y plataforma de API de DeepSeek\"],\"strengths_es\":[\"Sus ganancias de eficiencia vinieron de mejoras algorítmicas y de arquitectura, no de mejor hardware\",\"Sus lanzamientos quedan a pocos puntos porcentuales de los mejores modelos estadounidenses a cerca de una décima parte del precio por API, y V4 Flash queda a un solo punto de GPT-5.6 Luna en el índice de Artificial Analysis, según el informe de Graylin de 2026\"],\"weaknesses_es\":[\"Depende de chips que no puede comprar legalmente: el CSIS recoge afirmaciones de medios chinos de que entrenó R1 con H100 prohibidos, algo que no podría admitir sin confesar una actividad ilegal según la ley estadounidense\"],\"incentives_es\":\"Ofrece sus modelos mediante una aplicación, un chat web y una API de pago, y publica versiones de pesos abiertos.\"},{\"id\":\"Google DeepMind\",\"slug\":\"google-deepmind\",\"kind\":\"organisation\",\"title\":\"Google DeepMind\",\"title_es\":\"Google DeepMind\",\"summary\":\"Google's AI lab, formed from DeepMind and Google Brain, whose research produced AlphaGo, AlphaFold and the Transformer behind today's language models.\",\"summary_es\":\"El laboratorio de IA de Google, nacido de la unión de DeepMind y Google Brain, cuya investigación produjo AlphaGo, AlphaFold y el Transformer que sustenta los modelos de lenguaje actuales.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AGI timelines\",\"Compute as the constraint\",\"AI race\",\"Power concentration\"],\"positions\":[],\"sources\":[{\"id\":\"2026-about-google-deepmind\",\"title\":\"About Google DeepMind\",\"url\":\"https://deepmind.google/about/\"},{\"id\":\"2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al\",\"title\":\"Demis Hassabis — Scaling, superhuman AIs, AlphaZero atop LLMs, AlphaFold\",\"url\":\"https://www.dwarkesh.com/p/demis-hassabis\"},{\"id\":\"2026-wikipedia-google-deepmind\",\"title\":\"Google DeepMind\",\"url\":\"https://en.wikipedia.org/wiki/Google_DeepMind\"}],\"body\":\"DeepMind started in 2010 with an interdisciplinary approach to building general AI, pioneered deep reinforcement learning and used games to test its systems. Google Brain started in 2011 at X. The merged lab is led by Hassabis.\\n\\nWikipedia records that DeepMind was founded in 2010 by Demis Hassabis, Shane Legg and Mustafa Suleyman, was known as DeepMind until 2023, is owned by Google, and beat Lee Sedol at Go in 2016.\\n\\nSources: [[2026-about-google-deepmind]], [[2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al]], [[2026-wikipedia-google-deepmind]]\\n\",\"founded\":\"23 September 2010 (DeepMind); merged with Google Brain in 2023\",\"headquarters\":\"London\",\"products\":[\"Gemini\",\"AlphaGo and AlphaZero\",\"AlphaFold\",\"Veo (video)\",\"JAX and TensorFlow\"],\"people\":[\"Demis Hassabis\"],\"strengths\":[\"Its two labs produced AlphaGo, AlphaFold and, in 2017, the Transformer architecture that underpins almost all large language models, by the company's own account\",\"Hassabis says DeepMind's twenty-year plan from 2010 is on track\"],\"weaknesses\":[],\"incentives\":\"Part of Google. Its research runs Google's infrastructure, from machine translation to ranking search results and serving ads, and it says it has unparalleled computing infrastructure.\",\"products_es\":[\"Gemini\",\"AlphaGo y AlphaZero\",\"AlphaFold\",\"Veo (vídeo)\",\"JAX y TensorFlow\"],\"strengths_es\":[\"Sus dos laboratorios produjeron AlphaGo, AlphaFold y, en 2017, la arquitectura Transformer que sustenta casi todos los grandes modelos de lenguaje, según la propia empresa\",\"Hassabis dice que el plan a veinte años de DeepMind, desde 2010, va según lo previsto\"],\"weaknesses_es\":[],\"incentives_es\":\"Forma parte de Google. Su investigación hace funcionar la infraestructura de Google, desde la traducción automática hasta la ordenación de resultados de búsqueda y la publicidad, y dice contar con una infraestructura de cómputo sin igual.\"},{\"id\":\"Meta\",\"slug\":\"meta\",\"kind\":\"organisation\",\"title\":\"Meta\",\"title_es\":\"Meta\",\"summary\":\"The social media company whose AI lab releases the Llama models with open weights, a strategy Zuckerberg argues is good for Meta and for the world.\",\"summary_es\":\"La empresa de redes sociales cuyo laboratorio de IA publica los modelos Llama con pesos abiertos, una estrategia que Zuckerberg defiende como buena para Meta y para el mundo.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Power concentration\",\"Open-weight models\",\"Yann LeCun\"],\"positions\":[],\"sources\":[{\"id\":\"2024-open-source-ai-is-the-path-forward\",\"title\":\"Open Source AI is the Path Forward\",\"url\":\"https://about.fb.com/news/2024/07/open-source-ai-is-the-path-forward/\"},{\"id\":\"2026-wikipedia-meta-ai\",\"title\":\"Meta AI\",\"url\":\"https://en.wikipedia.org/wiki/Meta_AI\"}],\"body\":\"Zuckerberg's July 2024 letter sets out why Meta is committed to open source AI: it is the best development stack, it is good for Meta, and it is good for the world.\\n\\nWikipedia records that Meta's AI lab was founded in 2013 as Facebook AI Research (FAIR), directed by Yann LeCun until 2018, with research in self-supervised learning, generative adversarial networks, translation and computer vision.\\n\\nSources: [[2024-open-source-ai-is-the-path-forward]], [[2026-wikipedia-meta-ai]]\\n\",\"founded\":\"AI lab (FAIR) 2013\",\"headquarters\":\"$undefined\",\"products\":[\"Llama models, released with open weights\",\"Meta AI assistant\"],\"people\":[\"Mark Zuckerberg\",\"Yann LeCun\"],\"strengths\":[\"Releases frontier-level models with open weights; Zuckerberg says running Llama 3.1 405B on your own hardware costs roughly half as much as closed models like GPT-4o\"],\"weaknesses\":[],\"incentives\":\"Selling access to AI models is not its business model, Zuckerberg says: it builds experiences and services for people, and open-sourcing Llama serves that and frees it from platforms that tax developers.\",\"products_es\":[\"Llama 3.1 405B, el primer modelo de pesos abiertos de nivel de frontera, en palabras de Zuckerberg\",\"El asistente Meta AI\"],\"strengths_es\":[\"Publica modelos de nivel de frontera con pesos abiertos; Zuckerberg dice que ejecutar Llama 3.1 405B en hardware propio cuesta aproximadamente la mitad que modelos cerrados como GPT-4o\"],\"weaknesses_es\":[],\"incentives_es\":\"Vender acceso a modelos de IA no es su negocio, dice Zuckerberg: construye experiencias y servicios para la gente, y abrir Llama sirve a eso y la libera de plataformas que cobran peaje a los desarrolladores.\"},{\"id\":\"Microsoft\",\"slug\":\"microsoft\",\"kind\":\"organisation\",\"title\":\"Microsoft\",\"title_es\":\"Microsoft\",\"summary\":\"The software and cloud company that sells AI as Copilot inside Windows, Office and GitHub, and as Azure capacity for others' models.\",\"summary_es\":\"La empresa de software y nube que vende IA como Copilot dentro de Windows, Office y GitHub, y como capacidad de Azure para los modelos de otros.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Cloud computing\",\"Power concentration\",\"Data centres\",\"AI and the energy transition\",\"Power as the limit\",\"OpenAI\",\"Climate targets\"],\"positions\":[],\"sources\":[{\"id\":\"2026-microsoft-ai-business-solutions-and-tools\",\"title\":\"Microsoft AI - Business Solutions and Tools\",\"url\":\"https://www.microsoft.com/en-us/ai\"},{\"id\":\"2025-general\",\"title\":\"General\",\"url\":\"https://www.selc.org/wp-content/uploads/2025/07/LEI-Data-Center-Final-Report-07072025-2.pdf\"},{\"id\":\"2026-wikipedia-microsoft\",\"title\":\"Microsoft\",\"url\":\"https://en.wikipedia.org/wiki/Microsoft\"}],\"body\":\"Microsoft's own AI page presents Copilot as a family of chat-based assistants, standalone and inside its products, with Azure and Foundry for building and evaluating models.\\n\\nWikipedia records that Microsoft was founded in 1975 by Bill Gates and Paul Allen, dominated PC operating systems with MS-DOS and Windows, and has invested more than 13 billion dollars in OpenAI.\\n\\nSources: [[2026-microsoft-ai-business-solutions-and-tools]], [[2025-general]], [[2026-wikipedia-microsoft]]\\n\",\"founded\":\"4 April 1975\",\"headquarters\":\"Redmond, Washington\",\"products\":[\"Microsoft Copilot and Microsoft 365 Copilot\",\"GitHub Copilot\",\"Azure and Microsoft Foundry\",\"Windows and Office\"],\"people\":[],\"strengths\":[\"Sells AI through the software most offices already run: Copilot in Word, Excel, PowerPoint and Teams, on top of Azure\"],\"weaknesses\":[\"Told a Georgia regulator in 2024 it was slowing or pausing some early-stage data-centre projects, and paused about one billion dollars of data centres in Ohio in 2025, as cited in the LEI report\"],\"incentives\":\"Sells Copilot licences on top of Microsoft 365 plans and rents Azure cloud capacity.\",\"products_es\":[\"Microsoft Copilot y Microsoft 365 Copilot\",\"GitHub Copilot\",\"Azure y Microsoft Foundry\",\"Windows y Office\"],\"strengths_es\":[\"Vende IA a través del software que ya usan la mayoría de las oficinas: Copilot en Word, Excel, PowerPoint y Teams, sobre Azure\"],\"weaknesses_es\":[\"Dijo a un regulador de Georgia en 2024 que frenaba o pausaba algunos proyectos de centros de datos en fase temprana, y en 2025 pausó unos mil millones de dólares en centros de datos en Ohio, según cita el informe de LEI\"],\"incentives_es\":\"Vende licencias de Copilot sobre los planes de Microsoft 365 y alquila capacidad de nube en Azure.\"},{\"id\":\"Nvidia\",\"slug\":\"nvidia\",\"kind\":\"organisation\",\"title\":\"Nvidia\",\"title_es\":\"Nvidia\",\"summary\":\"The chipmaker whose GPUs train and run most frontier AI, which makes it the chokepoint that export controls are built around.\",\"summary_es\":\"El fabricante de chips cuyas GPU entrenan y ejecutan la mayor parte de la IA de frontera, lo que la convierte en el cuello de botella en torno al que se diseñan los controles de exportación.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Export controls effect\",\"Compute as the constraint\",\"Chip manufacturing\",\"Export controls\",\"Power concentration\",\"AI and the energy transition\",\"Taiwan blockade\",\"Chip independence\"],\"positions\":[],\"sources\":[{\"id\":\"2026-nvidia-nvidia-corp-brochure\",\"title\":\"Nvidia - NVIDIA Corp Brochure\",\"url\":\"https://www.nvidia.com/en-us/about-nvidia/\"},{\"id\":\"2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch\",\"title\":\"DeepSeek, Huawei, Export Controls, and the Future of the U.S.-China AI Race\",\"url\":\"https://www.csis.org/analysis/deepseek-huawei-export-controls-and-future-us-china-ai-race\"},{\"id\":\"2025-general\",\"title\":\"General\",\"url\":\"https://www.selc.org/wp-content/uploads/2025/07/LEI-Data-Center-Final-Report-07072025-2.pdf\"},{\"id\":\"2025-bpc-report-electricity-demand-growth-and-data-centers-a-guid\",\"title\":\"BPC-Report-Electricity-Demand-Growth-and-Data-Centers-A-Guide-for-the-Perplexed\",\"url\":\"https://bipartisanpolicy.org/wp-content/uploads/2025/02/BPC-Report-Electricity-Demand-Growth-and-Data-Centers-A-Guide-for-the-Perplexed.pdf\"},{\"id\":\"2026-wikipedia-nvidia\",\"title\":\"Nvidia\",\"url\":\"https://en.wikipedia.org/wiki/Nvidia\"}],\"body\":\"Nvidia describes itself as the engine of AI and argues that accelerated computing is the way to make data centres sustainable. The CSIS report documents smuggling networks for its H100 chips and the H20 variant designed for the China market.\\n\\nWikipedia records that Nvidia was founded in 1993 by Jensen Huang, Chris Malachowsky and Curtis Priem, and that its products span GPUs, CPUs, networking and software.\\n\\nSources: [[2026-nvidia-nvidia-corp-brochure]], [[2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch]], [[2025-general]], [[2025-bpc-report-electricity-demand-growth-and-data-centers-a-guid]], [[2026-wikipedia-nvidia]]\\n\",\"founded\":\"5 April 1993\",\"headquarters\":\"Santa Clara, California\",\"products\":[\"Data-centre GPUs (H100, H800, H20)\",\"CUDA-based AI systems it calls AI factories\",\"RTX graphics and Omniverse\"],\"people\":[\"Jensen Huang\"],\"strengths\":[\"Held a 98% share of the data-centre GPU market in 2023, shipping 3.76 million units, according to the LEI report\"],\"weaknesses\":[\"Cut off from China's market by export controls; its chips are smuggled there, and Singapore was the billing location for 18% of its revenue in its latest fiscal year, according to CSIS\"],\"incentives\":\"Sells the chips, systems and software for what it calls AI factories. It funded Jonathan Koomey's 2025 report on data-centre electricity demand.\",\"products_es\":[\"GPU para centros de datos (H100, H800, H20)\",\"Sistemas de IA basados en CUDA que llama fábricas de IA\",\"Gráficos RTX y Omniverse\"],\"strengths_es\":[\"Tuvo el 98% del mercado de GPU para centros de datos en 2023, con 3,76 millones de unidades enviadas, según el informe de LEI\"],\"weaknesses_es\":[\"Los controles de exportación la apartan del mercado chino; sus chips llegan allí de contrabando, y Singapur fue el lugar de facturación del 18% de sus ingresos en su último ejercicio, según el CSIS\"],\"incentives_es\":\"Vende los chips, sistemas y software de lo que llama fábricas de IA. Financió el informe de 2025 de Jonathan Koomey sobre la demanda eléctrica de los centros de datos.\"},{\"id\":\"OpenAI\",\"slug\":\"openai\",\"kind\":\"organisation\",\"title\":\"OpenAI\",\"title_es\":\"OpenAI\",\"summary\":\"The company behind ChatGPT, started in 2015 to build AGI, which now calls itself a superintelligence research company.\",\"summary_es\":\"La empresa detrás de ChatGPT, fundada en 2015 para construir la IAG, que hoy se define como una empresa de investigación en superinteligencia.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AGI timelines\",\"Power concentration\",\"AI race\",\"AI and jobs\",\"Ilya Sutskever\",\"AI bubble\"],\"positions\":[],\"sources\":[{\"id\":\"2026-reflections\",\"title\":\"Reflections\",\"url\":\"https://blog.samaltman.com/reflections\"},{\"id\":\"2026-the-gentle-singularity\",\"title\":\"The Gentle Singularity\",\"url\":\"https://blog.samaltman.com/the-gentle-singularity\"},{\"id\":\"2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of\",\"title\":\"Decolonizing the Future: Karen Hao on Resisting the Empire of AI\",\"url\":\"https://www.techpolicy.press/decolonizing-the-future-karen-hao-on-resisting-the-empire-of-ai/\"},{\"id\":\"2025-game-over-agi-is-not-imminent-and-llms-are-not-the-royal-roa\",\"title\":\"Game over. AGI is not imminent, and LLMs are not the royal road to getting there.\",\"url\":\"https://garymarcus.substack.com/p/the-last-few-months-have-been-devastating\"},{\"id\":\"2026-wikipedia-openai\",\"title\":\"OpenAI\",\"url\":\"https://en.wikipedia.org/wiki/OpenAI\"}],\"body\":\"Altman dates the company's start to almost nine years before January 2025 and says it was founded on the belief that AGI was possible and could be the most impactful technology in history. ChatGPT, launched as a demo, kicked off the growth curve that made the industry. Hao's book Empire of AI uses OpenAI as the prism for the whole industry.\\n\\nWikipedia records that OpenAI was founded in 2015 as a nonprofit with Elon Musk and Sam Altman as co-chairs, that Musk resigned in 2018, that a for-profit subsidiary was created in 2019 and restructured in 2025 into OpenAI Group PBC, 26% owned by the nonprofit OpenAI Foundation, and that Microsoft has invested more than 13 billion dollars in it.\\n\\nSources: [[2026-reflections]], [[2026-the-gentle-singularity]], [[2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of]], [[2025-game-over-agi-is-not-imminent-and-llms-are-not-the-royal-roa]], [[2026-wikipedia-openai]]\\n\",\"founded\":\"8 December 2015\",\"headquarters\":\"San Francisco\",\"products\":[\"ChatGPT (launched 30 November 2022)\",\"GPT models and o3\",\"API\"],\"people\":[\"Sam Altman\"],\"strengths\":[\"ChatGPT grew from about 100 million to more than 300 million weekly users in the year to January 2025, by Altman's account\",\"It was the first company to turn AI development into a race, in Karen Hao's account of the industry\"],\"weaknesses\":[\"GPT-5 came late and fell short in August 2025, in Gary Marcus's reading of the year\",\"A governance crisis in November 2023, when the board fired Altman without warning, which he calls a big failure of governance\",\"Karen Hao argues it began as a nonprofit promising to be the good guys and became an empire\"],\"incentives\":\"Built a product company around ChatGPT and its API, with partners and customers, while describing itself as a superintelligence research company. Altman says it needed a crazy amount of capital.\",\"products_es\":[\"ChatGPT (lanzado el 30 de noviembre de 2022)\",\"Modelos GPT y o3\",\"API\"],\"strengths_es\":[\"ChatGPT pasó de unos 100 millones a más de 300 millones de usuarios semanales en el año hasta enero de 2025, según Altman\",\"Fue la primera empresa que convirtió el desarrollo de la IA en una carrera, según el relato de Karen Hao sobre la industria\"],\"weaknesses_es\":[\"GPT-5 llegó tarde y decepcionó en agosto de 2025, en la lectura del año de Gary Marcus\",\"Una crisis de gobernanza en noviembre de 2023, cuando el consejo despidió a Altman sin aviso, algo que él llama un gran fallo de gobernanza\",\"Karen Hao sostiene que empezó como una organización sin ánimo de lucro que prometía ser la buena de la película y acabó convertida en un imperio\"],\"incentives_es\":\"Construyó una empresa de producto en torno a ChatGPT y su API, con socios y clientes, mientras se describe como una empresa de investigación en superinteligencia. Altman dice que necesitó una cantidad disparatada de capital.\"},{\"id\":\"xAI\",\"slug\":\"xai\",\"kind\":\"organisation\",\"title\":\"xAI (now SpaceXAI)\",\"title_es\":\"xAI\",\"summary\":\"The AI company behind the Grok models, trained on Colossus, a 200,000 GPU cluster, and built to search inside the X social network.\",\"summary_es\":\"La empresa de IA detrás de los modelos Grok, entrenados en Colossus, un clúster de 200.000 GPU, y diseñados para buscar dentro de la red social X.\",\"region\":\"Power and work\",\"cluster\":\"The labs\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Compute as the constraint\",\"AGI timelines\",\"Power concentration\",\"Power as the limit\"],\"positions\":[],\"sources\":[{\"id\":\"2025-grok-4\",\"title\":\"Grok 4\",\"url\":\"https://x.ai/news/grok-4\"},{\"id\":\"2026-grok-api-documentation\",\"title\":\"Grok API Documentation\",\"url\":\"https://docs.x.ai/docs/overview\"},{\"id\":\"2026-wikipedia-xai\",\"title\":\"SpaceXAI\",\"url\":\"https://en.wikipedia.org/wiki/XAI_(company)\"}],\"body\":\"Its Grok 4 announcement of July 2025 describes scaling reinforcement learning to pretraining scale and training the model to use tools such as a code interpreter, web browsing and X search.\\n\\nWikipedia records that the company was founded in March 2023 as X.AI Corp, became SpaceXAI in 2026, runs a data-centre business around its Colossus cluster with Anthropic and Google as major customers, and that Musk stated in Musk v. Altman that Grok was partly developed by distillation from OpenAI models.\\n\\nSources: [[2025-grok-4]], [[2026-grok-api-documentation]], [[2026-wikipedia-xai]]\\n\",\"founded\":\"9 March 2023 (as X.AI Corp; renamed SpaceXAI in 2026)\",\"headquarters\":\"Palo Alto, California\",\"products\":[\"Grok 3 and Grok 4\",\"Grok API\",\"Colossus data-centre capacity, with Anthropic and Google among its customers\"],\"people\":[],\"strengths\":[\"Trained Grok 4 with reinforcement learning at pretraining scale on Colossus, its 200,000 GPU cluster, by its own account\"],\"weaknesses\":[],\"incentives\":\"Sells API access to its models and trains Grok to use search tools that reach deep into X.\",\"products_es\":[\"Grok 3 y Grok 4\",\"API de Grok\",\"Capacidad de centro de datos en Colossus, con Anthropic y Google entre sus clientes\"],\"strengths_es\":[\"Entrenó Grok 4 con aprendizaje por refuerzo a escala de preentrenamiento en Colossus, su clúster de 200.000 GPU, según la propia empresa\"],\"weaknesses_es\":[],\"incentives_es\":\"Vende acceso por API a sus modelos y entrena a Grok para usar herramientas de búsqueda que llegan al fondo de X.\"},{\"id\":\"Alvin Wang Graylin\",\"slug\":\"alvin-wang-graylin\",\"kind\":\"person\",\"title\":\"Alvin Wang Graylin\",\"title_es\":\"Alvin Wang Graylin\",\"summary\":\"Technology executive who was HTC's China president from 2016 to 2023 and argues against the US–China AI race framing.\",\"summary_es\":\"Directivo tecnológico, presidente de HTC en China entre 2016 y 2023, que critica el enfoque de carrera entre EE. UU. y China.\",\"region\":\"Power and work\",\"cluster\":\"The race\",\"last_reviewed\":\"2026-09-26\",\"related\":[\"AI race\"],\"positions\":[],\"sources\":[{\"id\":\"2025-there-can-be-no-winners-in-a-us-china-ai-arms-race\",\"title\":\"There can be no winners in a US-China AI arms race\",\"url\":\"https://www.technologyreview.com/2025/01/21/1110269/there-can-be-no-winners-in-a-us-china-ai-arms-race/\"},{\"id\":\"2026-the-wrong-race-the-us-china-and-ai-competition\",\"title\":\"The Wrong Race: The US, China, and AI Competition\",\"url\":\"https://quincyinst.org/research/the-wrong-race-the-us-china-and-ai-competition/\"}],\"body\":\"Sources: [[2025-there-can-be-no-winners-in-a-us-china-ai-arms-race]], [[2026-the-wrong-race-the-us-china-and-ai-competition]]\\n\",\"affiliation\":\"HTC (global vice president)\",\"incentives\":\"$undefined\",\"prominent\":false},{\"id\":\"Bill Gates\",\"slug\":\"bill-gates\",\"kind\":\"person\",\"title\":\"Bill Gates\",\"title_es\":\"Bill Gates\",\"summary\":\"Co-founder of Microsoft, who told The New York Times in 2026 that AI poses a grave threat to jobs and human life, that addressing the risks should be the world's top priority, and that the industry is downplaying them because of the money at stake.\",\"summary_es\":\"Cofundador de Microsoft, que dijo a The New York Times en 2026 que la IA supone una grave amenaza para el empleo y la vida humana, que afrontar los riesgos debería ser la máxima prioridad mundial y que la industria los minimiza por el dinero en juego.\",\"region\":\"Philosophy\",\"cluster\":\"Risk\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Existential risk\",\"AI and jobs\",\"Microsoft\"],\"positions\":[],\"sources\":[{\"id\":\"2026-bill-gates-warns-a-i-is-more-dangerous-than-big-tech-will-a\",\"title\":\"Bill Gates Warns A.I. Is More Dangerous Than Big Tech Will Admit\",\"url\":\"https://www.nytimes.com/2026/08/26/technology/bill-gates-ai-risks.html\"}],\"body\":\"Sources: [[2026-bill-gates-warns-a-i-is-more-dangerous-than-big-tech-will-a]]\\n\",\"affiliation hor of the essays Reflections and The Gentle Singularity on how close AGI is.\",\"summary_es\":\"Cofundador de OpenAI, a la que describe como una empresa de investigación en superinteligencia, y autor de los ensayos Reflections y The Gentle Singularity sobre lo cerca que está la IAG.\",\"region\":\"Power and work\",\"cluster\":\"The race\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AGI timelines\",\"Novices or experts\",\"AI and the energy transition\",\"OpenAI\",\"Existential risk\"],\"positions\":[],\"sources\":[{\"id\":\"2026-reflections\",\"title\":\"Reflections\",\"url\":\"https://blog.samaltman.com/reflections\"},{\"id\":\"2026-the-gentle-singularity\",\"title\":\"The Gentle Singularity\",\"url\":\"https://blog.samaltman.com/the-gentle-singularity\"}],\"body\":\"Sources: [[2026-reflections]], [[2026-the-gentle-singularity]]\\n\",\"affiliation\":\"OpenAI (co-founder)\",\"incentives\":\"Leads the company whose progress toward AGI and superintelligence he forecasts, and which sells the products whose energy use he describes.\",\"prominent\":true},{\"id\":\"Sarah Myers West\",\"slug\":\"sarah-myers-west\",\"kind\":\"person\",\"title\":\"Sarah Myers West\",\"title_es\":\"Sarah Myers West\",\"summary\":\"Researcher at the AI Now Institute who, with Jai Vipra, studies how control of computing power shapes the AI industry.\",\"summary_es\":\"Investigadora del AI Now Institute que, con Jai Vipra, estudia cómo el control de la capacidad de cómputo condiciona la industria de la IA.\",\"region\":\"Power and work\",\"cluster\":\"Concentration of power\",\"last_reviewed\":\"2026-09-26\",\"related\":[\"Power concentration\"],\"positions\":[],\"sources\":[{\"id\":\"2023-computational-power-and-ai-comment-submission\",\"title\":\"Computational Power and AI: Comment Submission\",\"url\":\"https://ainowinstitute.org/publications/policy-brief/computational-power-and-ai\"}],\"body\":\"Sources: [[2023-computational-power-and-ai-comment-submission]]\\n\",\"affiliation\":\"AI No ntives\":\"$undefined\",\"prominent\":false},{\"id\":\"Sherry Turkle\",\"slug\":\"sherry-turkle\",\"kind\":\"person\",\"title\":\"Sherry Turkle\",\"title_es\":\"Sherry Turkle\",\"summary\":\"MIT professor of the social studies of science and technology, author of Reclaiming Conversation, who studies how people relate to machines that seem to care.\",\"summary_es\":\"Profesora del MIT de estudios sociales de la ciencia y la tecnología, autora de Reclaiming Conversation, que estudia cómo se relacionan las personas con máquinas que parecen preocuparse por ellas.\",\"region\":\"Mind and attention\",\"cluster\":\"Attention\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI companions\",\"Artificial intimacy\"],\"positions\":[],\"sources\":[{\"id\":\"2025-reclaiming-conversation-in-the-age-of-ai\",\"title\":\"Reclaiming Conversation in the Age of AI\",\"url\":\"https://www.afterbabel.com/p/reclaiming-conversation-age-of-ai\"}],\"body\":\"Sources: [[2025-reclaiming-conversation-in-the-age-of-ai]]\\n\",\"affiliation\":\"Massachusetts Institute of Technology\",\"incentives\":\"$undefined\",\"prominent\":true},{\"id\":\"Sian Leah Beilock\",\"slug\":\"sian-leah-beilock\",\"kind\":\"person\",\"title\":\"Sian Leah Beilock\",\"title_es\":\"Sian Leah Beilock\",\"summary\":\"Cognitive scientist and president of Dartmouth who argues that universities should teach students to use AI critically and productively.\",\"summary_es\":\"Científica cognitiva y presidenta de Dartmouth que sostiene que las universidades deben enseñar a los estudiantes a usar la IA de forma crítica y productiva.\",\"region\":\"Mind and attention\",\"cluster\":\"Learning\",\"last_reviewed\":\"2026-09-26\",\"related\":[\"AI and learning\"],\"positions\":[],\"sources\":[{\"id\":\"2026-why-i-want-more-ai-at-dartmouth\",\"title\":\"Why I Want More AI at Dartmouth\",\"url\":\"https://www.theatlantic.com/ideas/archive/2026/09/universities-prohibiting-ai-classroom/688509/\"}],\"body\":\"Sources: [[2026-why-i-want-more-ai-at-dartmouth]]\\n\",\"affiliation\":\"Dartmouth College\",\"incentives\":\"$undefined\",\"prominent\":false},{\"id\":\"Sujai Shivakumar\",\"slug\":\"sujai-shivakumar\",\"kind\":\"person\",\"title\":\"Sujai Shivakumar\",\"title_es\":\"Sujai Shivakumar\",\"summary\":\"Technology and industrial policy researcher who studies semiconductor innovation and supply chains.\",\"summary_es\":\"Investigador de política tecnológica e industrial que estudia la innovación y las cadenas de suministro de semiconductores.\",\"region\":\"Power and work\",\"cluster\":\"Chips and supply\",\"last_reviewed\":\"2026-09-25\",\"related\":[\"Export controls effect\"],\"positions\":[],\"sources\":[{\"id\":\"2025-the-limits-of-chip-export-controls-in-meeting-the-china-chal\",\"title\":\"The Limits of Chip Export Controls in Meeting the China Challenge\",\"url\":\"https://www.csis.org/analysis/limits-chip-export-controls-meeting-china-challenge\"},{\"id\":\"2026-chinas-localization-drive-in-semiconductors-gains-impetus-fr\",\"title\":\"China’s Localization Drive in Semiconductors Gains Impetus from Allied Chip Export Controls\",\"url\":\"https://www.csis.org/analysis/chinas-localization-drive-semiconductors-gains-impetus-allied-chip-export-controls\"}],\"body\":\"Sources: [[2025-the-limits-of-chip-export-controls-in-meeting-the-china-chal]], [[2026-chinas-localization-drive-in-semiconductors-gains-impetus-fr]]\\n\",\"affiliation\":\"Renewing American Innovation, Center for Strategic and International Studies\",\"incentives\":\"$undefined\",\"prominent\":false},{\"id\":\"Tim Wu\",\"slug\":\"tim-wu\",\"kind\":\"person\",\"title\":\"Tim Wu\",\"title_es\":\"Tim Wu\",\"summary\":\"Columbia Law School professor and former White House official, a leading voice of the anti-monopoly movement.\",\"summary_es\":\"Profesor de la Facultad de Derecho de Columbia y exfuncionario de la Casa Blanca, una de las voces principales del movimiento antimonopolio.\",\"region\":\"Power and work\",\"cluster\":\"Concentration of power\",\"last_reviewed\":\"2026-09-26\",\"related\":[\"Power concentration\"],\"positions\":[],\"sources\":[{\"id\":\"2025-tim-wu-on-the-age-of-extraction-and-how-big-tech-broke-the-i\",\"title\":\"Tim Wu on ‘The Age of Extraction’ and How Big Tech Broke the Internet’s Promise\",\"url\":\"https://boardroom.tv/tim-wu-the-age-of-extraction-interview/\"},{\"id\":\"2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of\",\"title\":\"Decolonizing the Future: Karen Hao on Resisting the Empire of AI\",\"url\":\"https://www.techpolicy.press/decolonizing-the-future-karen-hao-on-resisting-the-empire-of-ai/\"}],\"body\":\"Sources: [[2025-tim-wu-on-the-age-of-extraction-and-how-big-tech-broke-the-i]], [[2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of]]\\n\",\"affiliation\":\"Columbia Law School\",\"incentives\":\"$undefined\",\"prominent\":true},{\"id\":\"Yann LeCun\",\"slug\":\"yann-lecun\",\"kind\":\"person\",\"title\":\"Yann LeCun\",\"title_es\":\"Yann LeCun\",\"summary\":\"Chief AI scientist at Meta, NYU professor and Turing Award winner, who argues autoregressive language models are not the road to human-level intelligence.\",\"summary_es\":\"Científico jefe de IA en Meta, profesor de la NYU y premio Turing, que sostiene que los modelos de lenguaje autorregresivos no son el camino a la inteligencia de nivel humano.\",\"region\":\"Philosophy\",\"cluster\":\"Understanding\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Machine understanding\",\"World models\",\"AGI timelines\",\"Meta\",\"Existential risk\"],\"positions\":[],\"sources\":[{\"id\":\"2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms\",\"title\":\"Transcript for Yann Lecun: Meta AI, Open Source, Limits of LLMs, AGI \u0026 the Future of AI | Lex Fridman Podcast #416\",\"url\":\"https://lexfridman.com/yann-lecun-3-transcript\"}],\"body\":\"Sources: [[2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms]]\\n\",\"affiliation\":\"Meta (chief AI scientist); New York University\",\"incentives\":\"Leads AI research at Meta, whose open-weight models compete with the language-model labs he criticises.\",\"prominent\":true},{\"id\":\"Yoshua Bengio\",\"slug\":\"yoshua-bengio\",\"kind\":\"person\",\"title\":\"Yoshua Bengio\",\"title_es\":\"Yoshua Bengio\",\"summary\":\"Professor of computer science at the University of Montreal and Mila, a signatory of the 2023 statement that extinction risk from AI should be a global priority.\",\"summary_es\":\"Catedrático de informática en la Universidad de Montreal y Mila, firmante de la declaración de 2023 según la cual el riesgo de extinción por la IA debería ser una prioridad mundial.\",\"region\":\"Philosophy\",\"cluster\":\"Risk\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Existential risk\"],\"positions\":[],\"sources\":[{\"id\":\"2026-cais-statement-on-ai-risk\",\"title\":\"Statement on AI Extinction Risk | CAIS\",\"url\":\"https://www.safe.ai/work/statement-on-ai-risk\"}],\"body\":\"Sources: [[2026-cais-statement-on-ai-risk]]\\n\",\"affiliation\":\"University of Montreal / Mila\",\"incentives\":\"$undefined\",\"prominent\":true},{\"id\":\"AGI timelines\",\"slug\":\"agi-timelines\",\"kind\":\"question\",\"title\":\"Is AGI close?\",\"title_es\":\"¿Está cerca la IAG?\",\"summary\":\"Lab leaders say systems that match people at most intellectual work could arrive within a few years, and OpenAI says it now knows how to build one. Critics say today's language models are not on the road to it at all, and the target itself keeps moving.\",\"summary_es\":\"Los líderes de los laboratorios dicen que sistemas capaces de igualar a las personas en casi todo el trabajo intelectual podrían llegar en pocos años, y OpenAI afirma que ya sabe cómo construirlos. Los críticos sostienen que los modelos de lenguaje actuales no llevan a ese destino, y que la propia meta no deja de moverse.\",\"region\":\"Power and work\",\"cluster\":\"The race\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AGI\",\"AI race\",\"Compute as the constraint\",\"Novices or experts\",\"AI arms race\",\"Leopold Aschenbrenner\",\"Existential risk\",\"Ilya Sutskever\"],\"positions\":[{\"id\":\"Demis Hassabis on AGI timelines\",\"person\":\"Demis Hassabis\",\"stance\":\"He gives no specific number because of the many unknowns, but DeepMind was founded in 2010 as a twenty-year project and is on track, so he would not be surprised by AGI-like systems within the next decade.\",\"stance_es\":\"No da una cifra concreta por las muchas incógnitas, pero DeepMind se fundó en 2010 como un proyecto a veinte años y va según lo previsto, así que no le sorprendería ver sistemas similares a la IAG en la próxima década.\",\"date\":\"2024-02-28\",\"quote\":\"I wouldn’t be surprised if we had AGI-like systems within the next decade.\",\"source\":{\"id\":\"2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al\",\"url\":\"https://www.dwarkesh.com/p/demis-hassabis\",\"title\":\"Demis Hassabis — Scaling, superhuman AIs, AlphaZero atop LLMs, AlphaFold\"},\"support_passage\":\"I don’t have prescribed specific numbers to it because I think there’s so many unknowns and uncertainties. ... when we started DeepMind back in 2010, we thought of it as a 20-year project. And I think we’re on track actually ... So I wouldn’t be surprised if we had AGI-like systems within the next decade.\"},{\"id\":\"Dario Amodei on AGI timelines\",\"person\":\"Dario Amodei\",\"stance\":\"Powerful AI, his term for what others call AGI, could arrive as early as 2026, though there are also ways it could take much longer.\",\"stance_es\":\"La IA potente, su término para lo que otros llaman IAG, podría llegar ya en 2026, aunque también hay maneras de que tarde mucho más.\",\"date\":\"2024-10\",\"quote\":\"I think it could come as early as 2026, though there are also ways it could take much longer.\",\"source\":{\"id\":\"2026-dario-amodei-machines-of-loving-grace\",\"url\":\"https://darioamodei.com/machines-of-loving-grace\",\"title\":\"Dario Amodei — Machines of Loving Grace\"},\"support_passage\":\"What powerful AI (I dislike the term AGI)3 will look like, and when (or if) it will arrive, is a huge topic in itself. ... I think it could come as early as 2026, though there are also ways it could take much longer.\"},{\"id\":\"Sam Altman on AGI timelines\",\"person\":\"Sam Altman\",\"stance\":\"Humanity is past the event horizon and the takeoff toward digital superintelligence has started: 2026 will likely bring systems that find novel insights and 2027 may bring robots that do real-world tasks.\",\"stance_es\":\"La humanidad ha cruzado el horizonte de sucesos y el despegue hacia la superinteligencia digital ha empezado: 2026 traerá probablemente sistemas capaces de hallar ideas nuevas y 2027 quizá robots que hagan tareas en el mundo físico.\",\"date\":\"2025\",\"quote\":\"We are past the event horizon; the takeoff has started.\",\"source\":{\"id\":\"2026-the-gentle-singularity\",\"url\":\"https://blog.samaltman.com/the-gentle-singularity\",\"title\":\"The Gentle Singularity\"},\"support_passage\":\"We are past the event horizon; the takeoff has started. Humanity is close to building digital superintelligence ... 2026 will likely see the arrival of systems that can figure out novel insights. 2027 may see the arrival of robots that can do tasks in the real world.\"},{\"id\":\"Gary Marcus on AGI timelines\",\"person\":\"Gary Marcus\",\"stance\":\"Large language models are not the road to AGI: after the Apple reasoning paper, GPT-5's shortfall and other setbacks in 2025, anyone expecting the current paradigm to be close to AGI is deluded.\",\"stance_es\":\"Los grandes modelos de lenguaje no son el camino a la IAG: tras el artículo de Apple sobre razonamiento, el decepcionante GPT-5 y otros reveses de 2025, quien espere que el paradigma actual esté cerca de la IAG se engaña.\",\"date\":\"2025-10-18\",\"quote\":\"LLMs have their place, but anyone expecting the current paradigm to be close to AGI is delusional.\",\"source\":{\"id\":\"2025-game-over-agi-is-not-imminent-and-llms-are-not-the-royal-roa\",\"url\":\"https://garymarcus.substack.com/p/the-last-few-months-have-been-devastating\",\"title\":\"Game over. AGI is not imminent, and LLMs are not the royal road to getting there.\"},\"support_passage\":\"LLMs have their place, but anyone expecting the current paradigm to be close to AGI is delusional.\"},{\"id\":\"Ilya Sutskever on AGI timelines\",\"person\":\"Ilya Sutskever\",\"stance\":\"A system that learns as well as a human and then becomes superhuman is five to twenty years away; the age of scaling, roughly 2020 to 2025, is over because pre-training data is finite, and the field is back in the age of research.\",\"stance_es\":\"Un sistema que aprenda tan bien como un humano y luego se vuelva sobrehumano está a entre cinco y veinte años; la era del escalado, más o menos de 2020 a 2025, ha terminado porque los datos de preentrenamiento son finitos, y el campo vuelve a la era de la investigación.\",\"date\":\"2025-11-25\",\"quote\":\"we are back to the age of research\",\"source\":{\"id\":\"2026-dwarkesh-sutskever\",\"url\":\"https://www.dwarkesh.com/p/ilya-sutskever-2\",\"title\":\"Ilya Sutskever — We're moving from the age of scaling to the age of research\"},\"support_passage\":\"At some point though, pre-training will run out of data. The data is very clearly finite. ... But now that compute is big, compute is now very big, in some sense we are back to the age of research. ... Up until 2020, from 2012 to 2020, it was the age of research. Now, from 2020 to 2025, it was the age of scaling ... I think like 5 to 20. / 5 to 20 years? / Mhm.\"}],\"sources\":[{\"id\":\"2026-dario-amodei-machines-of-loving-grace\",\"title\":\"Dario Amodei — Machines of Loving Grace\",\"url\":\"https://darioamodei.com/machines-of-loving-grace\"},{\"id\":\"2026-the-gentle-singularity\",\"title\":\"The Gentle Singularity\",\"url\":\"https://blog.samaltman.com/the-gentle-singularity\"},{\"id\":\"2026-reflections\",\"title\":\"Reflections\",\"url\":\"https://blog.samaltman.com/reflections\"},{\"id\":\"2025-game-over-agi-is-not-imminent-and-llms-are-not-the-royal-roa\",\"title\":\"Game over. AGI is not imminent, and LLMs are not the royal road to getting there.\",\"url\":\"https://garymarcus.substack.com/p/the-last-few-months-have-been-devastating\"},{\"id\":\"2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al\",\"title\":\"Demis Hassabis — Scaling, superhuman AIs, AlphaZero atop LLMs, AlphaFold\",\"url\":\"https://www.dwarkesh.com/p/demis-hassabis\"}],\"body\":\"$26\",\"label_es\":\"¿IAG cerca?\",\"uncertainty\":\"empirical\",\"status\":\"open\",\"indicators\":[\"Whether each new model generation keeps improving at the pace of 2023 to 2025\",\"Whether AI agents complete long, multi-step real-world tasks without supervision\",\"How the labs' own definitions of AGI change over time\"],\"depends_on\":[\"Compute as the constraint\"],\"reframes\":[]},{\"id\":\"AI and jobs\",\"slug\":\"ai-and-jobs\",\"kind\":\"question\",\"title\":\"Is AI taking jobs, and whose?\",\"title_es\":\"¿Está la IA quitando empleos? ¿A quién?\",\"summary\":\"Economy-wide, employment has not visibly shifted since ChatGPT. But young workers in the most AI-exposed jobs are falling behind their peers, mostly through less hiring, and economists disagree on whether AI is the cause and how large its effect on work will become.\",\"summary_es\":\"En el conjunto de la economía, el empleo no ha cambiado de forma visible desde ChatGPT. Pero los trabajadores jóvenes de los empleos más expuestos a la IA se quedan atrás respecto a sus compañeros, sobre todo porque se contrata menos, y los economistas discrepan sobre si la causa es la IA y sobre cuán grande será su efecto en el trabajo.\",\"region\":\"Power and work\",\"cluster\":\"Work\",\"last_reviewed\":\"2026-09-26\",\"related\":[\"Tacit knowledge\",\"Jevons paradox\",\"AI race\",\"Novices or experts\",\"Jagged frontier\",\"Sam Altman\",\"Bill Gates\",\"Jensen Huang\"],\"positions\":[{\"id\":\"Daron Acemoglu on AI and jobs\",\"person\":\"Daron Acemoglu\",\"stance\":\"AI's macroeconomic effects will be nontrivial but modest: no more than a 0.66% rise in total factor productivity over ten years, and probably less, because early gains come from easy-to-learn tasks. AI is also predicted to widen the gap between capital and labour income.\",\"stance_es\":\"Los efectos macroeconómicos de la IA serán apreciables pero modestos: no más de un 0,66% de aumento de la productividad total de los factores en diez años, y probablemente menos, porque los primeros avances vienen de tareas fáciles de aprender. También se prevé que la IA amplíe la brecha entre las rentas del capital y del trabajo.\",\"date\":\"2024-05-12\",\"quote\":\"these macroeconomic effects appear nontrivial but modest\",\"source\":{\"id\":\"2024-the-simple-macroeconomics-of-ai\",\"url\":\"https://economics.mit.edu/sites/default/files/2024-05/The%20Simple%20Macroeconomics%20of%20AI.pdf\",\"title\":\"The Simple Macroeconomics of AI\"},\"support_passage\":\"these macroeconomic effects appear nontrivial but modest—no more than a 0.66% increase in total factor productivity (TFP) over 10 years. The paper then argues that even these estimates could be exaggerated, because early evidence is from easy-to-learn tasks ... AI is predicted to widen the gap between capital and labor income.\"},{\"id\":\"Cory Doctorow on AI and jobs\",\"person\":\"Cory Doctorow\",\"stance\":\"AI cannot do your job, but an AI salesman can convince your boss to replace you with it; when the bubble bursts, the AI will be switched off and no one will be doing the work.\",\"stance_es\":\"La IA no puede hacer tu trabajo, pero un vendedor de IA puede convencer a tu jefe de que te sustituya por ella; cuando estalle la burbuja, la IA se apagará y nadie hará ese trabajo.\",\"date\":\"2025-09-27\",\"quote\":\"AI cannot do your job, but an AI salesman can 100% convince your boss to fire you\",\"source\":{\"id\":\"2025-pluralistic-the-real-economic-ai-apocalypse-is-nigh\",\"url\":\"https://pluralistic.net/2025/09/27/econopocalypse/\",\"title\":\"Daily links from Cory Doctorow\"},\"support_passage\":\"AI cannot do your job, but an AI salesman can 100% convince your boss to fire you and replace you with an AI that can't do your job, and when the bubble bursts ... no one will do your job.\"},{\"id\":\"Dario Amodei on AI and jobs\",\"person\":\"Dario Amodei\",\"stance\":\"AI will disrupt about half of entry-level white-collar jobs within one to five years, even as it speeds up economic growth, though he agrees it is likely not displacing jobs yet.\",\"stance_es\":\"La IA trastocará cerca de la mitad de los empleos de oficina de nivel inicial en uno a cinco años, aunque acelere el crecimiento económico, si bien admite que probablemente todavía no está destruyendo empleo.\",\"date\":\"2026-01\",\"quote\":\"my prediction for 50% of entry level white collar jobs being disrupted is 1–5 years\",\"source\":{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\"},\"support_passage\":\"I predicted that AI could displace half of all entry-level white collar jobs in the next 1–5 years, even as it accelerates economic growth and scientific progress. ... some didn’t see the 1–5-year time range and thought I was claiming AI is displacing jobs right now (which I agree it is likely not).\"},{\"id\":\"Erik Brynjolfsson on AI and jobs\",\"person\":\"Erik Brynjolfsson\",\"stance\":\"There is no widespread job displacement yet, but employment of 22 to 25-year-olds in the most AI-exposed jobs is about 19% behind their less-exposed peers, mainly through less hiring and where AI automates rather than complements; the data are suggestive, not proof that AI is the cause.\",\"stance_es\":\"Aún no hay una destrucción generalizada de empleo, pero el empleo de los jóvenes de 22 a 25 años en los trabajos más expuestos a la IA está cerca de un 19% por detrás del de sus compañeros menos expuestos, sobre todo porque se contrata menos y donde la IA automatiza en lugar de complementar; los datos son indicativos, no prueba de que la causa sea la IA.\",\"date\":\"2026-08-12\",\"quote\":\"However, young workers in AI-exposed occupations are increasingly falling behind their less-exposed peers.\",\"source\":{\"id\":\"2026-no-widespread-displacement-but-the-ai-employment-gap-for-you\",\"url\":\"https://digitaleconomy.stanford.edu/news/canariesaug26/\",\"title\":\"No Widespread Displacement, but the AI Employment Gap for Young Workers Has Widened to 19%\"},\"support_passage\":\"We do not see widespread, economy-wide job displacement associated with AI. However, young workers in AI-exposed occupations are increasingly falling behind their less-exposed peers. ... The adjustment appears to operate primarily through reduced hiring ... These are descriptive patterns, not causal estimates\"},{\"id\":\"Bill Gates on AI and jobs\",\"person\":\"Bill Gates\",\"stance\":\"Mass job losses are inevitable unless they are addressed; past breakthroughs created more jobs than they eliminated, but he stakes everything he knows on this time being different, and some roles, such as caregiving, should be reserved for humans, an idea he calls Human Reserved.\",\"stance_es\":\"Las pérdidas masivas de empleo son inevitables si no se afrontan; los avances del pasado crearon más empleos de los que eliminaron, pero apuesta todo lo que sabe a que esta vez es distinto, y algunos papeles, como el de cuidador, deberían reservarse a las personas, una idea que llama Human Reserved.\",\"date\":\"2026-08-26\",\"quote\":\"$undefined\",\"source\":{\"id\":\"2026-bill-gates-warns-a-i-is-more-dangerous-than-big-tech-will-a\",\"url\":\"https://www.nytimes.com/2026/08/26/technology/bill-gates-ai-risks.html\",\"title\":\"Bill Gates Warns A.I. Is More Dangerous Than Big Tech Will Admit\"},\"support_passage\":\"He said mass job losses, if not addressed, were inevitable because A.I. would spread across the economy and leave little room for one industry to absorb the refugees from another. ... this time is 'utterly, absolutely, completely, totally different' ... 'Human Reserved'\"},{\"id\":\"Jensen Huang on AI and jobs\",\"person\":\"Jensen Huang\",\"stance\":\"The claim that AI will destroy jobs is a fallacy that has hardened into a harmful myth: AI will change every job and automate many tasks, and jobs that consist of a single task, such as phone customer service, could be automated away, but new industries will bring a net creation of jobs.\",\"stance_es\":\"La afirmación de que la IA destruirá empleos es una falacia convertida en un mito dañino: la IA cambiará todos los empleos y automatizará muchas tareas, y los empleos que consisten en una sola tarea, como la atención telefónica al cliente, podrían desaparecer, pero las nuevas industrias traerán una creación neta de empleo.\",\"date\":\"2026-09-23\",\"quote\":\"I believe that we are going to see jobs change en masse. I believe there’s going to be a net creation of jobs.\",\"source\":{\"id\":\"2026-jensen-huang-thinks-a-i-alarmism-has-gone-too-far\",\"url\":\"https://www.nytimes.com/2026/09/23/opinion/ezra-klein-podcast-jensen-huang.html\",\"title\":\"Jensen Huang Thinks A.I. Alarmism Has Gone Too Far\"},\"support_passage\":\"So I think the fallacy, and now, because of some of the narratives and some of the storytelling, it's turned into myth and it's harmful, is that A.I. will destroy jobs, which is fundamentally wrong. It will change every job. Many tasks will be automated. Some jobs, where the job and the task is really one, like customer service on the phone, in a lot of cases, that job is precisely the task. In those cases, it could be automated away. ... I believe there's going to be a net creation of jobs.\"}],\"sources\":[{\"id\":\"2026-no-widespread-displacement-but-the-ai-employment-gap-for-you\",\"title\":\"No Widespread Displacement, but the AI Employment Gap for Young Workers Has Widened to 19%\",\"url\":\"https://digitaleconomy.stanford.edu/news/canariesaug26/\"},{\"id\":\"2025-evaluating-the-impact-of-ai-on-the-labor-market-current-stat\",\"title\":\"Evaluating the Impact of AI on the Labor Market: Current State of Affairs\",\"url\":\"https://budgetlab.yale.edu/research/evaluating-impact-ai-labor-market-current-state-affairs\"},{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\"},{\"id\":\"2024-the-simple-macroeconomics-of-ai\",\"title\":\"The Simple Macroeconomics of AI\",\"url\":\"https://economics.mit.edu/sites/default/files/2024-05/The%20Simple%20Macroeconomics%20of%20AI.pdf\"},{\"id\":\"2025-pluralistic-the-real-economic-ai-apocalypse-is-nigh\",\"title\":\"Daily links from Cory Doctorow\",\"url\":\"https://pluralistic.net/2025/09/27/econopocalypse/\"},{\"id\":\"2026-bill-gates-warns-a-i-is-more-dangerous-than-big-tech-will-a\",\"title\":\"Bill Gates Warns A.I. Is More Dangerous Than Big Tech Will Admit\",\"url\":\"https://www.nytimes.com/2026/08/26/technology/bill-gates-ai-risks.html\"}],\"body\":\"$27\",\"label_es\":\"IA y empleo\",\"uncertainty\":\"empirical\",\"status\":\"open\",\"indicators\":[\"Employment of workers aged 22 to 25 in AI-exposed occupations (Stanford's Canaries Dashboard)\",\"Whether occupational change accelerates beyond its pre-ChatGPT trend (Yale Budget Lab)\"],\"depends_on\":[],\"reframes\":[]},{\"id\":\"AI and learning\",\"slug\":\"ai-and-learning\",\"kind\":\"question\",\"title\":\"Does relying on AI weaken how we learn and think?\",\"title_es\":\"¿Depender de la IA debilita nuestra forma de aprender y pensar?\",\"summary\":\"Students were among the first to adopt chatbots. Critics argue that letting AI do the reading and
