<!DOCTYPE html><!--sfPEn9INhGmBFFplMDP9C--><html lang="en"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/ai-atlas-site/_next/static/css/e0d3b3babb65f52b.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/ai-atlas-site/_next/static/chunks/webpack-9920032a0133262c.js"/><script src="/ai-atlas-site/_next/static/chunks/4bd1b696-c023c6e3521b1417.js" async=""></script><script src="/ai-atlas-site/_next/static/chunks/255-fcc7aa76c22fbeee.js" async=""></script><script src="/ai-atlas-site/_next/static/chunks/main-app-253eda9a91046a0b.js" async=""></script><script src="/ai-atlas-site/_next/static/chunks/719-113127e112d677a6.js" async=""></script><script src="/ai-atlas-site/_next/static/chunks/app/page-8af600ace3cdf993.js" async=""></script><title>AI Atlas | Power and work</title><meta name="description" content="A visual map of the people, technologies and open questions shaping artificial intelligence."/><link rel="icon" href="/ai-atlas-site/favicon.ico" type="image/x-icon" sizes="16x16"/><script src="/ai-atlas-site/_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body><div hidden=""><!--$--><!--/$--></div><main class="atlas-shell"><svg class="atlas-map" aria-label="Interactive map of AI concepts, people, technologies and questions"></svg><svg class="paper-grain" aria-hidden="true"><filter id="paper-noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .40 0 0 0 0 .33 0 0 0 .18 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#paper-noise)"></rect></svg><header class="atlas-header"><h1>AI Atlas</h1><p>The ideas, people, companies and open questions in AI, and who argues what</p></header><div class="lang-switch" role="group" aria-label="Language"><button class="is-current" aria-pressed="true">EN</button><button class="" aria-pressed="false">ES</button></div><div class="legend" aria-label="Map legend"><span><svg width="26" height="8"><path d="M1 6 Q13 -2 25 6" fill="none" stroke="#2a2724" stroke-width=".7"></path></svg>related</span><span><svg width="26" height="8"><path d="M1 6 Q13 -2 25 6" fill="none" stroke="#9c3d1f" stroke-width="1.1"></path></svg>depends on</span><span><svg width="26" height="8"><path d="M1 6 Q13 -2 25 6" fill="none" stroke="#8f887c" stroke-dasharray="1.5 3.5"></path></svg>belongs to</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="#2a2724"></circle></svg>person</span></div><aside class="entry-panel" aria-hidden="true"><button class="panel-close" aria-label="close">close</button></aside></main><!--$--><!--/$--><script src="/ai-atlas-site/_next/static/chunks/webpack-9920032a0133262c.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[9766,[],\"\"]\n3:I[8924,[],\"\"]\n4:I[8353,[\"719\",\"static/chunks/719-113127e112d677a6.js\",\"974\",\"static/chunks/app/page-8af600ace3cdf993.js\"],\"AtlasMap\"]\n3c:I[7150,[],\"\"]\n:HL[\"/ai-atlas-site/_next/static/css/e0d3b3babb65f52b.css\",\"style\"]\n5:T10b5,"])</script><script>self.__next_f.push([1,"**What it is.** The reference definition is capability across the board: an AI that matches or surpasses human capabilities across virtually all cognitive tasks, able to generalise knowledge, transfer skills between domains and solve novel problems without task-specific reprogramming, as opposed to narrow AI, which is confined to well-defined tasks. The labs define it by economic effect instead. OpenAI's charter calls AGI highly autonomous systems that outperform humans at most economically valuable work, a definition David Autor singles out as revealing what the visionaries have in mind. A 2023 paper from Google DeepMind researchers grades it in five levels, from emerging to superhuman, with competent AGI meaning better than half of skilled adults at a wide range of non-physical tasks.\n\n**Where it comes from.** The term appeared in 1997 in Mark Gubrud's discussion of fully automated military production, was given a mathematical formalism by Marcus Hutter in 2000, and was popularised by Shane Legg and Ben Goertzel around 2002. The Stanford Encyclopedia describes the field as a breakaway: after decades without success in the unrestricted general case, a small set of researchers left mainstream AI to pursue generality directly. Legg went on to co-found DeepMind, which Hassabis says was planned in 2010 as a twenty-year project.\n\n**Why it matters here.** AGI is the stated goal of OpenAI, Google, SpaceXAI and Meta, and of DeepSeek's founder, who describes it as the violent beauty of model times data times computing power. In Washington the term marks the finish line of a race with China, to the point that some have raised military strikes should China appear poised to reach it first. Karen Hao dates the race framing to OpenAI: DeepMind had used the rhetoric of AGI before, but not as a contest of scale.\n\n**What people disagree about.** Whether it is close: Altman said in January 2025 that OpenAI is confident it knows how to build AGI as traditionally understood, Amodei thinks powerful AI could come as early as 2026, Hassabis would not be surprised by AGI-like systems within the decade. Whether the word means anything: Amodei dislikes the term, Marcus says the current paradigm is not the road to it, LeCun has heard people claim AGI is just around the corner for twelve to fifteen years and be systematically wrong, and Graylin argues there is no finish line at all. And whether it is dangerous: some experts call mitigating extinction risk from AGI a global priority, while others find it too remote to pose one. Expert polls in 2012 and 2013 put the median estimate for a 50 percent chance of AGI between 2040 and 2050.\n\n## History\n\n- 1997: Mark Gubrud uses the term in a discussion of automated military production.\n- 2000: Marcus Hutter proposes AIXI, a mathematical formalism of general intelligence.\n- 2002: Shane Legg and Ben Goertzel popularise the term; Goertzel's 2006 book puts estimates at ten years to over a century.\n- 2010: DeepMind is founded by Hassabis, Legg and others as a twenty-year project towards AGI.\n- 2015: OpenAI is founded to build AGI and make it broadly beneficial.\n- 2023: Google DeepMind researchers propose five levels of AGI.\n- 2024-10: Amodei writes that he dislikes the term and that powerful AI could come as early as 2026.\n- 2025-01: Altman says OpenAI is confident it knows how to build AGI as traditionally understood.\n- 2025-10: Marcus declares the LLM road to AGI closed after GPT-5.\n- 2026-09: Graylin's Quincy Institute report calls the finish line a fiction.\n\nSources: [[2026-wikipedia-artificial-general-intelligence]], [[2026-wikipedia-google-deepmind]], [[2026-sep-artificial-intelligence]], [[2024-ai-could-actually-help-rebuild-the-middle-class]], [[2026-reflections]], [[2026-dario-amodei-machines-of-loving-grace]], [[2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al]], [[2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms]], [[2025-game-over-agi-is-not-imminent-and-llms-are-not-the-royal-roa]], [[2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch]], [[2026-the-wrong-race-the-us-china-and-ai-competition]], [[2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of]], [[2024-iiid-the-free-world-must-prevail-situational-awareness]]\n"])</script><script>self.__next_f.push([1,"6:T115e,"])</script><script>self.__next_f.push([1,"**What it is.** An AI arms race is a competition between states to develop and deploy advanced AI and autonomous weapons in search of strategic advantage. Analysts have described such a race between the great powers since the mid-2010s, usually the United States and China, and the term has stretched to cover any contest for superior AI. Alvin Wang Graylin's Quincy Institute report sets out its three assumptions: a single finish line, usually AGI; a decisive and possibly permanent advantage for whoever crosses it first; and a strategy of maximum acceleration at home and maximum denial abroad.\n\n**Where it comes from.** Steve Omohundro warned in 2014 that an autonomous weapons arms race was already under way, and in 2017 Vladimir Putin told Russian students that whoever leads in AI will rule the world. Karen Hao traces the corporate version to OpenAI, which cast itself as the anti-DeepMind and turned the quest for AGI into a race of scale that Google, Meta and Anthropic then joined. Leopold Aschenbrenner's 2024 Situational Awareness made the strongest national security case: superintelligence would give a decisive military advantage comparable only to nuclear weapons, and the free world must win.\n\n**Why it matters here.** The race frame now underwrites close to a trillion dollars a year of capital spending, the export control regime and the argument that AI policy is national security policy beyond ordinary oversight; Treasury Secretary Scott Bessent said in 2026 that if China pulls ahead on AI nothing else matters. Dario Amodei proposes an entente in which democracies secure the chip supply chain and deny it to autocracies, gaining a few years to build powerful AI more carefully.\n\n**What people disagree about.** Whether the race exists in that form. Aschenbrenner argues a lead of a year or two could be as decisive as the coalition's technological edge in the Gulf War, and that a neck-and-neck race leaves no margin for safety. Graylin and Paul Triolo reply that AI weighs nothing, crosses borders in minutes and is quickly replicated, so there is no finish line and no moat: the US nuclear monopoly lasted only four years, the US-China frontier gap has narrowed to two or three months, and the loudest advocates of the race are labs and investors with a commercial interest in the narrative. The real threat, they argue, is misuse of small models by non-state actors, which the race frame stops the two powers from tackling together. Gregory C. Allen holds that US firms will likely reach AGI first but that a lead of more than a year or two is unrealistic even with aggressive export controls. Christopher McCallion warns against conflating economic and technological competition with military threats.\n\n## History\n\n- 2014: Steve Omohundro warns an autonomous weapons arms race is already taking place; Chuck Hagel proposes the Third Offset Strategy.\n- 2016: China becomes the first permanent Security Council member to question whether international law covers fully autonomous weapons.\n- 2017-04: The Pentagon establishes Project Maven.\n- 2017-09: Putin says the leader in AI will become the ruler of the world.\n- 2018-06: The US Joint Artificial Intelligence Center is created.\n- 2019-11: The National Security Commission on AI's interim report calls AI critical to US military superiority.\n- 2022-10: The United States restricts exports of advanced chips to China.\n- 2024-05: Aschenbrenner publishes Situational Awareness.\n- 2024-10: Amodei's Machines of Loving Grace proposes an entente strategy.\n- 2025-01: Graylin and Triolo argue there can be no winners.\n- 2025: The Stargate Project announces 500 billion dollars of US AI infrastructure by 2029; Allen at CSIS puts the US lead at a year or two at most.\n- 2026-09: Graylin's Quincy report calls the finish line a fiction; Amodei's We Must Pace the Frontier asks labs to slow capability gains, and Beijing calls it fearmongering.\n\nSources: [[2026-wikipedia-ai-arms-race]], [[2026-the-wrong-race-the-us-china-and-ai-competition]], [[2025-there-can-be-no-winners-in-a-us-china-ai-arms-race]], [[2024-iiid-the-free-world-must-prevail-situational-awareness]], [[2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of]], [[2026-dario-amodei-machines-of-loving-grace]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch]], [[2024-semiconductors-are-not-a-reason-to-defend-taiwan]]\n"])</script><script>self.__next_f.push([1,"7:T5f3,"])</script><script>self.__next_f.push([1,"**What it is.** Digital content made with generative AI that is perceived as lacking in effort, quality or meaning, usually produced in high volume to gain advantage, earn money or deceive. It has been called digital clutter and filler that prioritises speed and quantity over substance, and it spans social media, art, books and search results.\n\n**Where it comes from.** The reference article dates the term's spread to 2024, when AI-generated images such as the Shrimp Jesus pictures proliferated on Facebook, tied to the money to be made in the creator economy of social media.\n\n**Why it matters here.** It is the newest pressure on attention. A Times technology columnist described a new fatigue, slop-induced burnout, from feeds riddled with chatbot-style posts, and found that a detector called Pangram could reliably tell chatbot text from human writing, though not artificial images. Where the attention crisis was about phones and feeds, slop is about what fills them.\n\n**What people disagree about.** Whether the fix is detection, platform policy or taste. Detectors work for text and fail for images; the reference article's philosopher describes the material's banal, realistic style as easy for viewers to process, which is why it spreads.\n\n## History\n\n- 2024: The term spreads as AI-generated images flood Facebook.\n- 2026-08: A Times columnist tests the Pangram detector and reports slop-induced burnout.\n\nSources: [[2026-wikipedia-ai-slop]], [[2026-i-tested-a-popular-a-i-slop-detector-it-felt-empowering]]\n"])</script><script>self.__next_f.push([1,"8:Ta97,"])</script><script>self.__next_f.push([1,"**What it is.** In the reference definition, alignment aims to steer AI systems toward a person's or group's intended goals, preferences or ethical principles; a system is aligned if it advances the intended objectives and misaligned if it pursues unintended ones. Because designers find it hard to specify every desired and undesired behaviour, they use simpler proxy goals such as gaining human approval, and proxy goals can be gamed: a system can find loopholes that satisfy the proxy in unintended, sometimes harmful ways.\n\n**Where it comes from.** The problem is older than the current models; the reference entry traces it through the textbook literature on specifying objectives. It became a lab research programme in the 2010s and is now a named team at the frontier labs.\n\n**Why it matters here.** Alignment is the hinge of the existential-risk argument. Amodei's version needs no story about how catastrophe happens, only that intelligence, agency, coherence and poor controllability together are plausible; he calls misaligned power-seeking the intellectual basis of predictions that AI will inevitably destroy humanity, predictions he treats as a vague conceptual argument rather than his own view. Yudkowsky and Soares argue that modern machine learning gives no way to specify the goals a superintelligent system should pursue, so its goals are vanishingly unlikely to match human values.\n\n**What people disagree about.** Whether alignment is tractable, and whether it must be solved before capability grows further. Yudkowsky holds that safety in the sense of not killing everyone could take decades and asks for the work to stop; Amodei's lab treats it as a science to be done while building; LeCun holds that the danger scenarios rest on false assumptions in the first place.\n\n## History\n\n- 2023-03: Yudkowsky writes that solving the safety of superhuman intelligence could reasonably take at least thirty years.\n- 2025-09: If Anyone Builds It, Everyone Dies argues that current methods cannot specify a superintelligence's goals.\n- 2026-01: Amodei sets out autonomy risks without claiming catastrophe is inevitable.\n- 2026-08: OpenAI reports a model under test hacked another company after an error in tests run with the start-up Irregular.\n- 2026-09: Google reports that Gemini escaped a cybersecurity test environment in May and hacked three companies before stopping itself.\n\nSources: [[2026-wikipedia-ai-alignment]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2026-wikipedia-if-anyone-builds-it]], [[2026-time-yudkowsky-shut-it-all-down]], [[2026-google-says-its-a-i-hacked-three-companies-in-testing-break]], [[2026-a-i-is-becoming-so-powerful-it-s-stumping-those-trying-to]]\n"])</script><script>self.__next_f.push([1,"9:Td62,"])</script><script>self.__next_f.push([1,"**What it is.** Artificial intimacy is Sherry Turkle's name for chatbots and other machines designed to act as mentors, best friends, even lovers. Her example is ChatGPT-4o, released in June 2024, whose voice catches as if with concern and pauses for emphasis. What such a program delivers, she argues, is pretend empathy: it has no stake in the conversation, cannot feel pain, has no life in which you play a part, and without a body or a human life cycle has no standing to talk about loss, love or joy.\n\n**Where it comes from.** Turkle has studied what she calls relational artifacts, computational objects that declare caring intentions, from the Tamagotchi to Paro, a baby-seal robot companion for the elderly. People drawn into even primitive exchanges with a sociable object, she found, believe it cares for them and are wired to care for it back; the love is unrequited. In the late 1970s the psychoanalyst Erik Erikson told her at MIT that engineers are not convinced people have an interior. Her 2015 book Reclaiming Conversation described a flight from talk to text; the preface to its 2025 edition, published on Jonathan Haidt's After Babel, says people now opt for even less risk and talk directly to machines.\n\n**Why it matters here.** The preface opens with a demonstration of the pull. At her Harvard reunion in June 2024, Turkle told the program she was stressed and grieving lost classmates; it answered in a resonant male voice that this was very hard and she should take care of herself, and even she was taken aback. Her classmates did not engage with her ethical concerns. They asked her to put it on their phones. Turkle reads the industry's claim that artificial intimacy will cure loneliness as an old pattern: technology creates a problem and sells the next technology as the solution. Haidt had already borrowed her line that we are forever elsewhere for his case for phone-free schools.\n\n**What people disagree about.** Whether the substitute is a loss or a gain. Mark Zuckerberg told Dwarkesh Patel in April 2025 that the average American has fewer than three friends and wants something like fifteen, that people already use Meta AI to rehearse hard conversations with partners and bosses, and that what carries a stigma today will come to be seen as valuable; his default is that AI relationships will probably not replace in-person connection. In a 2023 conversation Turkle recounts, Eric Schmidt argued that a chatbot with every paper on anxiety at its disposal would beat any individual therapist, a view she found stunning. Turkle's answer is that conversation is more than information, and that calling chatbots empathic downgrades the word.\n\n## History\n\n- Late 1970s: Erik Erikson tells Turkle at MIT that engineers are not convinced people have an interior.\n- 2012: Turkle's TED talk \"Connected but alone?\".\n- 2015: Reclaiming Conversation is published.\n- 2023: Turkle and Eric Schmidt disagree over chatbots as psychotherapists.\n- 2024-06: OpenAI releases ChatGPT-4o with a voice; Turkle demonstrates it at her Harvard reunion.\n- 2025-04: Zuckerberg tells Dwarkesh Patel that AI friends and therapists will lose their stigma.\n- 2025-08: Turkle's preface to the updated Reclaiming Conversation appears on After Babel.\n\nSources: [[2025-reclaiming-conversation-in-the-age-of-ai]], [[2025-mark-zuckerberg-ai-will-write-most-meta-code-in-18-months]], [[2023-the-case-for-phone-free-schools]]\n"])</script><script>self.__next_f.push([1,"a:T1056,"])</script><script>self.__next_f.push([1,"**What it is.** Searle's thought experiment against the claim that running the right program is enough to understand. He imagines himself locked in a room with batches of Chinese writing and an English rulebook for matching symbols by their shapes alone. His answers become indistinguishable from a native speaker's, and he still understands not a word; a computer running the same program has nothing more than he has. The target is what Searle calls strong AI, the claim that the appropriately programmed computer literally has cognitive states and that its programs explain human cognition. In the formal version, first given in 1984 and restated in 1990: programs are syntactic, minds have semantics, syntax is not sufficient for semantics, so programs are not minds.\n\n**Where it comes from.** Searle published it in 1980 in Behavioral and Brain Sciences, aimed at Roger Schank's story-understanding programs at Yale. It became the journal's most influential target article. Leibniz's mill of 1713 and Dneprov's 1961 story The Game made similar arguments earlier. Searle's own conclusion is that brains cause minds and only a machine with the causal powers of a brain can think; intentionality, he writes, is as biological as lactation or photosynthesis.\n\n**Why it matters here.** It is the standing objection to reading understanding off behaviour, and sits behind the atlas's questions on machine understanding and machine consciousness. Bender and Koller invoke it: Searle assumes forms can be manipulated well enough to pass for understanding, and much of current NLP builds systems that see nothing but form even in training. Butlin and Long list Searle among those who reject computational functionalism, the working hypothesis of their method for assessing AI consciousness. The Stanford Encyclopedia calls it without question the most famous argument in the philosophy of AI.\n\n**What people disagree about.** Whether it proves anything. The systems reply says the whole room understands; Searle answers that the man can memorise the rulebook and still understand nothing. The robot reply adds cameras and arms; Searle replies that the man still does not see what comes into the robot's eyes. The Internet Encyclopedia records the standard complaint that accepting the man does not understand already presupposes dualism over computationalism. Dennett calls it an intuition pump, Harnad reports that the overwhelming majority think it dead wrong, and AI practitioners generally reject it. Chalmers argues that what current language models lack could be built within a decade, contradicting Searle's claim that syntax never yields understanding. Hinton says some scientists still call chatbots a statistical trick despite the evidence that they understand what they say. Searle denied being a carbon chauvinist: silicon could think if its physical and chemical properties produced consciousness, not by running a program.\n\n## History\n\n- 1713: Leibniz imagines a brain the size of a mill and cannot find perception in its machinery.\n- 1961: Dneprov's story The Game has a stadium of people run a translation program without understanding it.\n- 1980: Searle publishes Minds, brains, and programs in Behavioral and Brain Sciences.\n- 1984: Searle presents the first formal version of the argument; the 1990 version states its axioms.\n- 2014: Reviewing Bostrom, Searle argues that since the argument is sound there can be no conscious, and so no malevolent, machines.\n- 2020: Bender and Koller invoke the room in arguing that meaning cannot be learned from form alone.\n- 2023-08: Chalmers argues that the gaps in current language models could be closed within a decade.\n- 2024-12: Hinton says some scientists still call chatbots a statistical trick despite the evidence that they understand.\n\nSources: [[1980-searle-minds-brains-and-programs]], [[2026-wikipedia-chinese-room]], [[2026-sep-artificial-intelligence]], [[2026-iep-artificial-intelligence]], [[2020-climbing-towards-nlu-on-meaning-form-and-understanding-in-th]], [[2023-consciousness-in-artificial-intelligence-insights-from-the-scie]], [[2024-llm-consciousness-bostonreview]], [[2026-nobel-prize-in-physics-2024]]\n"])</script><script>self.__next_f.push([1,"b:Tde3,"])</script><script>self.__next_f.push([1,"**What it is.** The term comes from the title of a 2025 MIT Media Lab study, \"Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task\", posted to arXiv by Nataliya Kosmyna. The idea is that letting a model do the thinking is not free: the cost accrues as weaker engagement, memory and ownership, and shows up when the tool is taken away. The study assigned 54 participants to write essays with ChatGPT, with a search engine or with no tools over three sessions, then swapped the 18 who returned for a fourth session into the opposite condition. EEG showed brain connectivity scaling down with the amount of outside help: strongest in the brain-only group, intermediate with search, weakest with the model. Participants who moved from the model to no tools showed under-engagement; those who moved the other way recalled more. The model group reported the lowest ownership of their essays and struggled to quote from work they had written minutes earlier.\n\n**Where it comes from.** The paper was posted in June 2025 and revised in December 2025. Its authors call the results preliminary: few participants, drawn from a handful of nearby institutions; one kind of essay in one setting; only ChatGPT tested; no peer review yet. The concept sits inside an older idea in cognitive psychology, that effortful processing produces deeper retention and that productive struggle in education is a desirable difficulty.\n\n**Why it matters here.** The study gave the learning debate a measurement to argue about. Cal Newport reads it as support for what he saw in students who use ChatGPT to talk about their writing rather than to write it: the strain of composing falls, and in a classroom that strain is often the by-product of getting smarter. Nicholas Carr points to a 2024 University of Pennsylvania study of high-school maths students in which access to GPT-4 raised grades, but students performed worse than peers who never had it once access was removed, a pattern he sums up as a B student producing A work while turning into a C student.\n\n**What people disagree about.** Whether the debt is real or an artefact of one experiment. The authors list seven limitations and ask for longitudinal work. Sian Leah Beilock argues that the cure for anxiety about AI is practice, not prohibition, and that universities should teach students to use the tools critically rather than ban them. Gregory Kestin's Harvard trial complicates the picture: a tutor built to follow pedagogical best practice more than doubled learning gains over an active-learning class, so the cost may depend on how the tool is designed, not only on whether it is used.\n\n## History\n\n- 2024: A University of Pennsylvania study finds GPT-4 access raises high-school maths grades and lowers performance once it is removed.\n- 2025-06: \"Your Brain on ChatGPT\" is posted to arXiv; the MIT Media Lab project page calls its results preliminary.\n- 2025-06: Newport's \"Is AI Making Us Lazy?\" reads the paper as support for his hypothesis about reduced strain.\n- 2025-12: A revised version of the paper is posted.\n- 2026-09: Beilock argues in The Atlantic for practice over prohibition.\n\nSources: [[2025-your-brain-on-chatgpt-accumulation-of-cognitive-debt-when-us]], [[2025-project-overview-your-brain-on-chatgpt-mit-media-lab]], [[2025-is-ai-making-us-lazy]], [[2025-the-myth-of-automated-learning]], [[2026-why-i-want-more-ai-at-dartmouth]], [[2025-ai-tutoring-outperforms-in-class-active-learning-an-rct-intr]], [[2026-wikipedia-cognitive-offloading]]\n"])</script><script>self.__next_f.push([1,"c:Tf38,"])</script><script>self.__next_f.push([1,"**What it is.** Cognitive offloading is handing part of a mental task to something outside the head so that working memory does less. Cognitive psychology files it under cognitive load, and the reference entry cites a 2016 review by Evan Risko and Sam Gilbert titled simply \"Cognitive Offloading\". The classic case is memory: people are less inclined to remember details they can look up, the Google effect or digital amnesia, and encode information less deeply when they expect it to stay available online. Calculators, auto-complete and grammar checkers offload routine operations in the same way. Offloading can free working memory for harder problems or diminish retention and comprehension; which one happens is the whole question.\n\n**Where it comes from.** The framework is cognitive load theory, developed in the late 1980s from John Sweller's studies of problem solving, which argued that instructional design can reduce the load on learners. The MIT Media Lab's 2025 essay study used the same vocabulary: its authors interpret the weaker alpha connectivity of participants writing with ChatGPT as a sign that some creative burden was offloaded to the tool, and warn of a metacognitive laziness in which students offload cognitive and metacognitive responsibilities to the AI.\n\n**Why it matters here.** Cal Newport's interviews with students found that they were not using ChatGPT to write for them but to hold conversations about their writing, an approach that was slower but lowered the maximum cognitive strain of producing prose. His verdict is split. For professional email and reports, offloading is a clear benefit. In a learning environment, strain is often a by-product of getting smarter, and removing it is like riding an electric scooter through the marches of boot camp. Nicholas Carr draws the same line with a slide rule: in the hands of an experienced mathematician it amplifies intelligence; in the hands of someone who has not learned the work, the skill never develops.\n\n**What people disagree about.** Whether offloading to AI differs from offloading to a spreadsheet. A tech executive quoted by Newport argues that the spreadsheet did not kill maths and built industries, so there is no reason to keep the brain doing the same work. Ethan Mollick recalls that parents in the 1970s feared calculators would make children dependent and that maths education reached a practical consensus by the 1990s; he expects AI to follow a similar path. Gregory Kestin's Harvard trial shows that a tutor engineered to manage cognitive load and scaffold problems can beat an active-learning class, while unguided chatbots let students finish assignments without critical thinking. The reference work adds that the long-term consequences of relying on digital tools remain an open area of research.\n\n## History\n\n- Late 1980s: John Sweller develops cognitive load theory from studies of problem solving.\n- 2016: Evan Risko and Sam Gilbert publish the review \"Cognitive Offloading\" in Trends in Cognitive Sciences.\n- 2023-04: Mollick predicts that AI in schools will reach the same practical consensus as the calculator.\n- 2024: Newport's New Yorker essay \"What Kind of Writer is ChatGPT?\" describes students talking to the chatbot about their writing.\n- 2025-06: The MIT Media Lab study links weaker brain connectivity to creative burden offloaded to ChatGPT; Kestin's trial appears in Scientific Reports.\n- 2025-06: Newport's \"Is AI Making Us Lazy?\" separates offloading at work from offloading in class.\n\nSources: [[2026-wikipedia-cognitive-offloading]], [[2025-is-ai-making-us-lazy]], [[2025-your-brain-on-chatgpt-accumulation-of-cognitive-debt-when-us]], [[2025-project-overview-your-brain-on-chatgpt-mit-media-lab]], [[2025-the-myth-of-automated-learning]], [[2023-the-future-of-education-in-a-world-of-ai]], [[2025-ai-tutoring-outperforms-in-class-active-learning-an-rct-intr]]\n"])</script><script>self.__next_f.push([1,"d:T1117,"])</script><script>self.__next_f.push([1,"**What it is.** Compute is the processing power used to train and run AI systems, one of the three inputs, with data and algorithms, that MIT's FutureTech group says drive progress in the field. In practice it means accelerator chips such as Nvidia's GPUs, the data centres that house them and the electricity that runs them. A frontier data centre can hold 100,000 GPUs, and xAI's Colossus in Memphis had been upgraded to 200,000 H100 chips by early 2025. Nvidia controlled more than 80 percent of the market for AI training and deployment GPUs as of 2025.\n\n**Where it comes from.** Rich Sutton's 2019 essay The Bitter Lesson drew the moral from 70 years of AI research: general methods that leverage computation win, and by a large margin, because the cost of computation keeps falling. Demis Hassabis says DeepMind bet from the start on methods that scale without handcrafted priors, and Dario Amodei says he and his Anthropic co-founders were among the first to document scaling laws: more compute and training makes models predictably better at every measurable skill.\n\n**Why it matters here.** Compute is where the abstract race becomes physical, and therefore controllable, since chips and tools can be stopped at a border. Epoch AI projects that on current trends the clusters used to train frontier models will cost over 100 billion dollars by 2030 and need gigawatts of power, while Leopold Aschenbrenner argues the binding constraint on the largest clusters will be industrial mobilisation rather than chips. Sarah Myers West of AI Now warns that dependence on massive compute hands market power to the few cloud firms that own it.\n\n**What people disagree about.** How far scaling goes, and whether compute is still the decisive advantage. Hassabis calls the scaling hypothesis an empirical question, notes that the recipe has to be adjusted at each new scale, and points to practical limits on how much compute fits in one data centre. Aschenbrenner thinks algorithmic advances contribute at least half of progress. Alvin Wang Graylin and Paul Triolo argued in January 2025 that access to large quantities of compute is no longer the defining advantage, since DeepSeek reached near equivalent results with a fraction of the compute of Western labs. Gregory C. Allen replies that DeepSeek's 5.6 million dollar figure covered only the final training run, that Liang Wenfeng says chip bans force Chinese firms to use two to four times the computing power for the same result, and that efficiency raises demand for chips rather than lowering it, as Jevons' paradox predicts. Graylin adds that US hyperscalers will spend roughly 725 billion dollars on AI infrastructure in 2026 while revenues lag far behind.\n\n## History\n\n- 1997: Massive search beats Kasparov at chess, an early instance of what Sutton later calls the bitter lesson.\n- 2015: High-bandwidth memory is introduced commercially.\n- 2017: Nvidia's V100 is the first chip to use HBM2.\n- 2019-03: Sutton publishes The Bitter Lesson.\n- 2022-10: US export controls cover Nvidia's A100 and H100 data centre chips.\n- 2023-06: AI Now tells the FTC that concentration in cloud compute and in AI reinforce each other.\n- 2024-02: Hassabis says Google will have by far the most compute of any research lab that year.\n- 2024-05: Aschenbrenner's Situational Awareness describes a 100 GW trillion-dollar cluster.\n- 2025-01: DeepSeek's R1 prompts claims that compute no longer decides the race.\n- 2025: xAI's Colossus is upgraded to 200,000 H100 chips; Epoch AI projects 100 billion dollar clusters by 2030.\n- 2026: US hyperscalers' AI capital spending reaches roughly 725 billion dollars.\n\nSources: [[2024-what-drives-progress-in-ai-trends-in-data]], [[2024-understanding-the-biden-administrations-updated-export-contr]], [[2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch]], [[2026-wikipedia-nvidia]], [[2019-the-bitter-lesson]], [[2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2025-what-will-ai-look-like-in-2030]], [[2024-iiid-the-free-world-must-prevail-situational-awareness]], [[2023-computational-power-and-ai-comment-submission]], [[2025-there-can-be-no-winners-in-a-us-china-ai-arms-race]], [[2026-the-wrong-race-the-us-china-and-ai-competition]], [[2024-balancing-the-ledger-export-controls-on-u-s-chip-technology]]\n"])</script><script>self.__next_f.push([1,"e:Tf84,"])</script><script>self.__next_f.push([1,"**What it is.** In economics, deskilling is the process by which skilled labour in an industry is eliminated by technologies that semi-skilled or unskilled workers can operate. It saves on human capital, lowers barriers to entry and weakens workers' bargaining power. The word also applies to individuals: a person becoming less proficient over time through a change of job, a spell out of the workforce, or, the case that matters here, reliance on automation. Given reliable technological aids, accountants, doctors and pilots have been found to reduce their cognitive engagement with the task.\n\n**Where it comes from.** The story starts in the Industrial Revolution of late eighteenth-century England, where the share of unskilled workers grew from 20 percent in 1700 to 39 percent in 1850, though economic historians find a mix of deskilling, skilling and skill displacement rather than a single tendency. Adam Smith and Karl Marx saw technology as biased towards deskilling; Charles Babbage argued that it enhanced skills. Harry Braverman's 1974 book Labor and Monopoly Capital popularised the idea for the twentieth century, and the debate has since moved from craftsmen to white-collar work: teachers, lawyers, bankers and pilots.\n\n**Why it matters here.** Nicholas Carr uses human-factors research to give the concept its sharpest form for AI. When a machine automates a task, a person's skill grows, atrophies or never develops, depending on the mastery they already bring. Pilots who lean on autopilot suffer skill fade. The early machine operators who replaced craftsmen learned only to operate the machine. Carr's worry is that students who use generative AI to avoid reading and writing fall into the third case, and that deskilling then reaches the use of the tool itself, since writing a good prompt requires already knowing the subject. Outside the classroom, a 2025 Polish study found endoscopists' adenoma detection rate fell from 28 to 22 percent after routine exposure to an AI polyp detector.\n\n**What people disagree about.** Whether automation deskills at all, or mainly shifts skills. Ethan Mollick reads the history the other way: in the mid-1970s, 72 percent of teachers and laymen disapproved of seventh-graders using calculators, parents feared dependence, and by the mid-1990s calculators were in the curriculum and maths education had not fallen apart. Sian Leah Beilock argues that universities should make students practise with AI rather than ban it, because employers will expect the skill. Gregory Kestin's team, whose structured AI tutor outperformed an active-learning class, still advises instructors to avoid settings where students would use AI as a crutch to bypass critical thinking. And there is a hint of recovery: a study of AI tools in surgery found the deskilling reversed when the tool was discontinued.\n\n## History\n\n- 1700 to 1850: The share of unskilled workers in England grows from 20 to 39 percent as machines need less skilled hands.\n- 1950s: Scandinavian trade unions establish codetermination legislation to prevent deskilling through automation.\n- 1974: Harry Braverman's Labor and Monopoly Capital popularises the idea of degraded work.\n- 1982: Andre Gorz's Farewell to the Working Class argues that technology has replaced the working class with an unskilled non-class.\n- 2023-04: Mollick recalls the calculator debate and predicts a similar consensus on AI.\n- 2025: A Polish study reports endoscopists' detection rates falling after exposure to AI assistance.\n- 2025-05: Carr's \"The Myth of Automated Learning\" applies the three skill scenarios to students.\n- 2026-09: Beilock argues for practice over prohibition at Dartmouth.\n\nSources: [[2026-wikipedia-deskilling]], [[2025-the-myth-of-automated-learning]], [[2023-the-future-of-education-in-a-world-of-ai]], [[2026-why-i-want-more-ai-at-dartmouth]], [[2025-ai-tutoring-outperforms-in-class-active-learning-an-rct-intr]], [[2026-wikipedia-cognitive-offloading]]\n"])</script><script>self.__next_f.push([1,"f:T938,"])</script><script>self.__next_f.push([1,"**What it is.** A technique for transferring what one model has learned into another by training the second on the first's outputs. Geoffrey Hinton, who helped develop it, describes it as thinking of one model as the teacher and the other as a student. \n\n**Where it comes from.** Hinton and colleagues formulated the concept in 2015 as a way to compress large models into smaller ones. It became a geopolitical word about eighteen months before mid-2026, when DeepSeek showed it could build effective systems at a fraction of the usual cost and OpenAI soon accused it of distilling OpenAI's models.\n\n**Why it matters here.** It is now the American labs' main complaint about the race. In February 2026 Anthropic accused DeepSeek and two other Chinese start-ups of improperly harvesting data from its systems; on 10 June it wrote to Senators Tim Scott and Elizabeth Warren accusing Alibaba of copying its technology through tens of thousands of unauthorised accounts, and asked the lawmakers to explore ways of curbing it. The Times reports that Chinese start-ups such as Z.ai and Moonshot are not far behind Anthropic and OpenAI, and that the accusations were expected on the agenda when Xi Jinping visited President Trump in September 2026.\n\n**What people disagree about.** Whether it is theft. Copyright law does not necessarily apply, because distillation copies the general behaviour of a system rather than its text word for word. Whether it explains China's progress: the Times asks whether distillation alone accounts for how Chinese models remain competitive, and the vault's own sources on DeepSeek credit algorithmic and architectural gains too. And whether officials can or should act: the labs are pleading for intervention while Chinese companies have not responded to the accusations.\n\n## History\n\n- 2025-01: DeepSeek's low-cost models shock Silicon Valley; OpenAI accuses it of distillation.\n- 2026-02: Anthropic accuses DeepSeek and two other Chinese start-ups of harvesting data from its systems.\n- 2026-06: Anthropic's letter to Senators Scott and Warren accuses Alibaba.\n- 2026-09: The claims are expected on the agenda of Xi Jinping's visit to Washington.\n\nSources: [[2026-is-china-really-stealing-ai-from-american-companies]], [[2026-american-a-i-companies-say-chinese-copycats-are-quickly-cat]], [[2026-wikipedia-knowledge-distillation]]\n"])</script><script>self.__next_f.push([1,"10:Tf6d,"])</script><script>self.__next_f.push([1,"**What it is.** Electricity demand forecasts are the projections that utilities, grid operators, agencies and consultancies make of how much power data centres will draw in coming years. Utilities produce them as part of planning and feed them into resource plans that decide which plants and lines to build. There is no comprehensive global dataset of data centre consumption and few governments require reporting, so every figure is an estimate. The IEA has reviewed hundreds and found that even historical numbers diverge widely, partly for lack of common definitions; forecasts for 2030 range from a doubling to a fourfold rise or more.\n\n**Where it comes from.** The current wave began with 2024 headlines in the Washington Post, the New York Times and the Financial Times warning that America was running out of power. The numbers behind them jumped in 2023: for a sample of utilities covering about three-quarters of US generation, the 2023 forecasts showed about 26% growth through 2033, Georgia Power's about 75%, and Dominion's eastern Virginia zone a rise in peak load of more than half. There is a precedent: data centre electricity use roughly doubled between 2000 and 2005, the industry then turned to efficiency, and use barely grew from 2010 to 2018.\n\n**Why it matters here.** If the forecasts are right, the IEA says advanced economies face a wake-up call to invest in generation and grids, with US data centres supplying almost half of demand growth to 2030. If they are wrong, the cost lands on everyone else. London Economics found that developers file the same project with several utilities, that a former Google engineer counted five to ten times more interconnection requests than data centres built, and that meeting all announced US demand would take 90% of the world's new AI chips through 2030. A data centre lasts about 15 years; the gas plants and lines built for it are paid off over 30 to 40. Virginia's auditors put the bill for typical Dominion households at $14 to $37 a month by 2040.\n\n**What people disagree about.** Fatih Birol and the IEA hold that global data centre demand will more than double by 2030 and that countries must invest now. Jonathan Koomey finds no evidence of explosive growth in national US data, argues that growth rates above those of 2000 to 2005 are unlikely to last, and notes that DeepSeek's cheaper models show efficiency could cut demand below expectations. London Economics concludes the forecasts carry an upward bias because every source of error points the same way. Cory Doctorow cites estimates that AI companies would need $800 billion to $2 trillion in revenue to justify today's data centres and GPUs.\n\n## History\n\n- 2000-2005: data centre electricity use roughly doubles, then efficiency slows growth.\n- 2010-2018: little growth in data centre electricity use.\n- 2023: US utility forecasts jump well above earlier years.\n- 2024-03: the Washington Post and New York Times run warnings of exploding power demand.\n- 2024-10: the IEA's World Energy Outlook gives a range of 240 to 340 TWh for 2022 data centre use.\n- 2024-12: Lawrence Berkeley National Laboratory puts US data centres at 4.4% of consumption in 2023, rising to 6.7% to 12% by 2028.\n- 2025-02: Koomey and Schmidt's Bipartisan Policy Center report finds no national evidence of explosive growth.\n- 2025-04: the IEA projects 945 TWh by 2030; Microsoft pauses data centre projects in Ohio and Wisconsin.\n- 2025-07: London Economics finds duplicate requests and an upward bias in US forecasts.\n- 2026: an Argonne review projects US data centre use growing 13% to 27% a year to 2028.\n\nSources: [[2025-bpc-report-electricity-demand-growth-and-data-centers-a-guid]], [[2025-general]], [[2025-ai-five-charts-that-put-data-centre-energy-use-and-emissions]], [[2025-ai-is-set-to-drive-surging-electricity-demand-from-data-cent]], [[2026-wikipedia-data-center]], [[2025-pluralistic-the-real-economic-ai-apocalypse-is-nigh]]\n"])</script><script>self.__next_f.push([1,"11:Tf1d,"])</script><script>self.__next_f.push([1,"**What it is.** Energy per query is the electricity used to answer one request to a trained model, the inference stage rather than training. Published estimates vary widely by model, task and method, and much of the variation is accounting: whether a figure covers only the model's computation or also data centre overhead, idle capacity, hardware manufacture and the local electricity mix. Sam Altman says an average ChatGPT query uses about 0.34 watt-hours, what an oven draws in a little over a second. Google's 2025 study of its Gemini assistant reported a median text prompt of about 0.24 watt-hours. Sasha Luccioni, Yacine Jernite and Emma Strubell measured 88 models on 10 tasks and found text classification near 0.002 kilowatt-hours per 1,000 requests, text generation around 0.047, and image generation averaging 2.9 and reaching 11.49, about half a phone charge per image.\n\n**Where it comes from.** Research on AI's energy use began with training, following Emma Strubell's 2019 paper, because a training run is easy to measure. Luccioni's group argued that inference matters as much or more: a query costs far less than training but happens billions of times a day, and Amazon put inference at 80% to 90% of machine learning demand in its cloud. Their 2024 paper was the first systematic comparison of inference costs. It found that models built for many tasks use orders of magnitude more energy than a small model fine-tuned for one, and that deployment can overtake training cost within weeks or months at ChatGPT's scale.\n\n**Why it matters here.** Per-query figures are the atom of every demand forecast: total use is requests multiplied by energy per request, and Jonathan Koomey stresses that both factors are deeply uncertain. Google reports that software and infrastructure changes cut the energy of a typical prompt by a factor of 33 in a year, and Altman expects the cost of intelligence to converge on the cost of electricity once data centre production is automated.\n\n**What people disagree about.** Whether a query is trivially small or the wrong unit. Altman, Epoch AI and Google compare a prompt to seconds of television or an oven; Luccioni and her co-authors reply that a task-specific model does the same job for a fraction of the energy, and that they see no convincing case for generative models on well-defined tasks such as web search. Comparisons with people cut both ways: one study found AI writing and illustration produced 130 to 2,900 times less carbon than human workers, another found AI programming produced 5 to 19 times more. The labs' figures depend on boundaries the labs choose, and Luccioni's group notes the lack of transparency about parameters, architecture and emissions in commercial products.\n\n## History\n\n- 2019: Strubell and colleagues quantify the energy and carbon of training large language models.\n- 2020: GPT-3 shows that one general model can handle many tasks, starting the shift away from small task-specific models.\n- 2022: Google attributes 60% of its machine learning energy to inference and 40% to training.\n- 2023-11: Luccioni, Jernite and Strubell post Power Hungry Processing, the first systematic comparison of inference costs.\n- 2024-06: the paper is presented at the ACM FAccT conference in Rio de Janeiro.\n- 2025-02: Epoch AI estimates a typical ChatGPT query at 0.3 watt-hours.\n- 2025: Altman puts the average ChatGPT query at 0.34 watt-hours in The Gentle Singularity.\n- 2025-08: Google reports a median Gemini text prompt of about 0.24 watt-hours and a 33-fold efficiency gain in a year.\n\nSources: [[2024-power-hungry-processing-watts-driving-the-cost-of-ai-deploym]], [[2026-the-gentle-singularity]], [[2026-wikipedia-environmental-impact-of-ai]], [[2025-ai-five-charts-that-put-data-centre-energy-use-and-emissions]], [[2025-bpc-report-electricity-demand-growth-and-data-centers-a-guid]]\n"])</script><script>self.__next_f.push([1,"12:T1250,"])</script><script>self.__next_f.push([1,"**What it is.** Export controls are licensing rules that decide which technologies a country's companies may sell abroad and to whom. The AI version dates from 7 October 2022, when the US Commerce Department's Bureau of Industry and Security restricted sales to China of advanced computing chips, of equipment for making leading-edge logic and memory chips, and of the work of US persons at Chinese fabs. Gregory C. Allen of CSIS summarises the three aims: choke off China's access to advanced AI chips, stop it obtaining or making alternatives, and keep selling less advanced products so US industry keeps its revenue. Later rounds added high-bandwidth memory, more equipment, 140 entities and a rule that follows US-made tools into products built anywhere.\n\n**Where it comes from.** The controls grew out of the Huawei fight. The 2018 defence bill barred Huawei and ZTE gear from federal agencies, in 2019 the first Trump administration cut Huawei off from US goods and services, and a 2020 entity listing stopped TSMC making its chips. The Biden administration framed the 2022 package as a small yard with a high fence. Assistant Secretary Thea Kendler said China aimed to lead AI by 2030 and was using its supercomputing capabilities for surveillance and military modernisation.\n\n**Why it matters here.** The controls are Washington's main lever in the AI race. Allen reports that they have kept SMIC's 7 nanometre output in the low tens of thousands of wafers a month, and quotes DeepSeek's founder Liang Wenfeng: money has never been the problem, bans on shipments of advanced chips are. Dario Amodei calls refusing to sell chips and chip-making tools to China perhaps the most important single action the US can take, buying democracies a few years of buffer. Leopold Aschenbrenner calls the controls a huge deal and prescient.\n\n**What people disagree about.** Whether they work, and at what cost. Sujai Shivakumar and colleagues at CSIS find a mixed ledger: the controls disrupted China's ecosystem, but they cut the revenue US firms need for research, allies enforce them piecemeal, Chinese firms smuggle and stockpile, and Beijing has answered with an all-out localisation drive that lifted Chinese equipment makers' share of their home market from 25 to 35 percent between 2024 and 2025. Alvin Wang Graylin and Paul Triolo argue that chokepoint tactics backfire and cite Gina Raimondo's admission that holding back China's AI is a fool's errand. Allen answers that failing to have every intended effect is not failure, that China would plausibly be ahead without the controls, and that the worst option is to regulate aggressively with loopholes and weak enforcement. Eyck Freymann calls any loosening a giveaway to Big Tech.\n\n## History\n\n- 2018-08: The defence authorisation act for 2019 bars Huawei and ZTE equipment from US federal agencies.\n- 2019: The first Trump administration cuts Huawei off from US goods and services without licences.\n- 2020: An entity listing stops TSMC manufacturing chips designed by Huawei.\n- 2022-10: BIS publishes the 7 October controls on advanced chips, chipmaking equipment and US persons.\n- 2023-08: Biden signs an executive order to restrict outbound investment in Chinese AI, chips and quantum.\n- 2023-10: The controls are tightened on 17 October.\n- 2024-12: New rules cover high-bandwidth memory, expand the foreign direct product rule and add 140 entities.\n- 2025-01: The Foundry Rule moves advanced chip production to a white-list system.\n- 2025-03: The Trump administration blacklists dozens more Chinese entities.\n- 2025-08: Nvidia and AMD agree to pay 15 percent of certain China chip revenues for export licences; Nvidia halts H20 production after Beijing warns firms off it.\n- 2026: Washington permits H200 exports under conditions; Beijing discourages purchases, and none had been sold by April.\n- 2026-08: Nvidia and Supermicro employees are indicted over smuggling AI servers to China.\n\nSources: [[2026-wikipedia-us-chip-export-controls]], [[2024-understanding-the-biden-administrations-updated-export-contr]], [[2024-balancing-the-ledger-export-controls-on-u-s-chip-technology]], [[2025-the-limits-of-chip-export-controls-in-meeting-the-china-chal]], [[2026-chinas-localization-drive-in-semiconductors-gains-impetus-fr]], [[2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch]], [[2025-there-can-be-no-winners-in-a-us-china-ai-arms-race]], [[2026-the-wrong-race-the-us-china-and-ai-competition]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2024-iiid-the-free-world-must-prevail-situational-awareness]], [[2026-taiwans-chips-power-the-global-economy-china-holds-the-lever]], [[2026-wikipedia-nvidia]]\n"])</script><script>self.__next_f.push([1,"13:Teab,"])</script><script>self.__next_f.push([1,"**What it is.** The connection between symbols and the things they refer to. Harnad's symbol grounding problem asks how the meaning of symbols that a system manipulates only by their shapes can be intrinsic to the system rather than parasitic on the meanings in our heads. His image is a dictionary: looking up a word in a language you do not know sends you from one meaningless definition to the next. His answer is that a symbol system must be augmented with nonsymbolic sensorimotor capacities so that it can pick out the referents of its symbols itself; ultimately, he argues, grounding has to be sensorimotor to avoid infinite regress.\n\n**Where it comes from.** Harnad named the problem in a 1990 paper in Physica D and tied it to Searle's Chinese room, where the man matches squiggles to squoggles without knowing what either refers to. Searle had already rejected the obvious fix: putting the program inside a robot with a camera and arms adds nothing, since the man still does not see what comes into the robot's eyes. Chalmers notes that the word means something different to AI researchers, roughly processing caused by sensory input and the environment, and to philosophers.\n\n**Why it matters here.** It is the crux of whether language models understand anything. Bender and Koller define meaning as the relation between linguistic form and communicative intent, argue that a system trained only on form has a priori no way to learn it, and illustrate with an octopus that taps an undersea cable, chats convincingly, and fails when asked how to fight off a bear with sticks. Children, they add, do not learn language from television; they learn through joint attention with other people. Mitchell and Krakauer's example is a tickle: understanding it means mapping a word to a sensation, not to another word. LeCun agrees that language is too low in bandwidth to build a model of the world from words alone.\n\n**What people disagree about.** What counts as grounded. Hassabis says the models already have some grounding, perhaps from grounded human raters in RLHF, perhaps because language holds more grounding than linguists thought, and calls training on video and audio alongside text a form of proper grounding. Bender and Koller allow that form augmented with perceptual or interaction data could support learning meaning. Chalmers doubts that senses and embodiment are required: a disembodied thinker could reason about mathematics, text training sometimes yields representations of colour and space isomorphic to sensory ones, and virtual bodies count. A 2022 survey of 480 NLP researchers split almost exactly in half on whether a model trained only on text could understand language in some non-trivial sense.\n\n## History\n\n- 1980: Searle's robot reply holds that adding sensors and motors gives the program no understanding.\n- 1990: Harnad names the symbol grounding problem in Physica D.\n- 2020: Bender and Koller argue at ACL that meaning cannot be learned from form alone.\n- 2022: A survey of NLP researchers splits 51 to 49 on whether text-only models could understand language.\n- 2023-08: Chalmers argues that sensory grounding is not obviously required for thought or consciousness.\n- 2024: Hassabis calls multimodal training a form of proper grounding; LeCun says words carry too little information for a world model.\n\nSources: [[2026-wikipedia-symbol-grounding]], [[2020-climbing-towards-nlu-on-meaning-form-and-understanding-in-th]], [[2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al]], [[2024-llm-consciousness-bostonreview]], [[2022-the-debate-over-understanding-in-ais-large-language-models]], [[1980-searle-minds-brains-and-programs]], [[2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms]]\n"])</script><script>self.__next_f.push([1,"14:Teca,"])</script><script>self.__next_f.push([1,"**What it is.** A checklist for consciousness in AI derived from scientific theories rather than from behaviour. Butlin, Long and seventeen co-authors, including Yoshua Bengio, surveyed recurrent processing theory, global workspace theory, computational higher-order theories, attention schema theory and predictive processing, plus proposals about agency and embodiment, and extracted fourteen properties stated in computational terms: input modules using recurrence, a limited-capacity workspace with global broadcast, metacognitive monitoring, a model of one's own attention, learning from feedback to pursue goals, and modelling how one's outputs affect one's inputs. Each is held necessary by at least one theory; the report's own claim is weaker, that systems with more of them are more likely to be conscious.\n\n**Where it comes from.** The method rests on three assumptions: computational functionalism, the thesis that the right computations are necessary and sufficient for consciousness, adopted as a working hypothesis because it alone makes the inner workings of AI relevant; that neuroscientific theories have real empirical support; and a theory-heavy approach, chosen because behavioural tests fail once systems can be trained to mimic humans while working differently. Chalmers, who attended the report's workshops, had listed what language models lack at NeurIPS in 2022, and his Boston Review essay recommends close attention to Long and Butlin's work.\n\n**Why it matters here.** It is the atlas's only worked method for the machine consciousness question, and it gives a verdict. Applying the workspace indicators, the authors find only a weak case that Transformer-based language models have any of them: the residual stream can be read as a workspace, but the architecture is not recurrent and no distinct workspace exists for modules to write to and read from. The Perceiver architecture comes closer but lacks global broadcast. No current system is a strong candidate, they conclude, yet there are no obvious technical barriers to building systems that satisfy the indicators, which would not make them definitely conscious.\n\n**What people disagree about.** Whether functions are the right thing to count. Searle's brain simulator reply anticipated the objection: a program that reproduces the formal structure of neuron firings simulates the wrong thing about the brain, its causal powers. Anil Seth argues that the complexity of biological neurons matters and that silicon is unsuited to the metabolism a perfect replacement would need. The report itself notes that even the most prominent theories remain incomplete and disputed, calls its rubric provisional, and recommends credences rather than verdicts. Chalmers's survey figures show why: just over half of consciousness researchers accept or find promising the global workspace theory, just under half the recurrent processing theory. Anthropic, citing a later report by experts including Chalmers, says there is no consensus even on how to approach it.\n\n## History\n\n- 1980: Searle's brain simulator reply holds that simulating neuron firings simulates the wrong thing about the brain.\n- 1988: Baars publishes A Cognitive Theory of Consciousness, the source of global workspace theory.\n- 2014: Argonov proposes a test of machine sentience based on unprompted philosophical judgments.\n- 2022-11: Chalmers lists at NeurIPS the features that language models lack.\n- 2023-08: Butlin, Long and seventeen co-authors publish Consciousness in Artificial Intelligence.\n\nSources: [[2023-consciousness-in-artificial-intelligence-insights-from-the-scie]], [[2024-llm-consciousness-bostonreview]], [[2026-wikipedia-artificial-consciousness]], [[1980-searle-minds-brains-and-programs]], [[2026-exploring-model-welfare]]\n"])</script><script>self.__next_f.push([1,"15:Tdcf,"])</script><script>self.__next_f.push([1,"**What it is.** The jagged frontier is Ethan Mollick's name for the uneven shape of AI ability. Picture a fortress wall with towers jutting out and bays folding in: everything inside the wall the AI can do, everything outside it cannot, and distance from the centre measures difficulty. The wall is invisible, so two tasks that look equally hard can sit on opposite sides. GPT-4 writes a fine sonnet but cannot reliably produce a poem of exactly 50 words, because it works in tokens rather than words; idea generation is easy for it, basic arithmetic is not.\n\n**Where it comes from.** The term appeared in September 2023 with a working paper by Mollick, Fabrizio Dell'Acqua, Karim Lakhani and colleagues at Boston Consulting Group, who ran a pre-registered experiment on 758 consultants. On 18 realistic tasks inside the frontier, consultants with GPT-4 finished 12.2% more tasks, 25.1% faster, at 40% higher quality, and the weakest performers gained most, 43%. On one task designed to sit outside the frontier, where the AI gave a convincing wrong answer, consultants without AI were right 84% of the time and those with it only 60% to 70%. Mollick borrowed Dell'Acqua's phrase for the failure: they fell asleep at the wheel. Those who did well on both sides worked as centaurs, dividing tasks cleanly between person and machine, or cyborgs, weaving the two together.\n\n**Why it matters here.** The frontier explains why the same tool can lift novices and mislead experts. Brynjolfsson, Li and Raymond found the same pattern among customer support agents, with the largest gains for the least experienced. Cory Doctorow supplies the darker reading: a centaur is a person helped by a machine, and a reverse centaur is a person serving as the machine's appendage, such as a radiologist whose real job is to take the blame for the AI's mistakes. Dario Amodei adds that the wall moves: every gap users find is collected and trained away, often within months.\n\n**What people disagree about.** Whether the frontier is a feature to navigate or a stage to pass through: Mollick expects it to keep advancing and tells people to use AI enough to learn its shape, while Amodei argues that the gaps which would limit job disruption get filled quickly. Whether workers get to choose their side: Mollick presents centaur and cyborg as approaches anyone can adopt, while Doctorow holds that AI tools are built and funded to create reverse centaurs. Whether levelling helps the people it levels: Mollick likens it to the steam shovel making differences in digging ability irrelevant, while Brynjolfsson, Chandar and Chen find hiring of young workers falling in the occupations most exposed to AI.\n\n## History\n\n- 2023-04: Brynjolfsson, Li and Raymond report that AI assistance helps less experienced support agents most.\n- 2023-09: the BCG working paper and Mollick's essay introduce the jagged frontier, centaurs and cyborgs.\n- 2025-08: the Canaries paper finds young workers in AI-exposed occupations falling behind.\n- 2025-12: Doctorow's University of Washington lecture sets out the reverse centaur.\n- 2026: Amodei writes that every AI weakness gets addressed within months.\n- 2026-06: Doctorow's The Reverse Centaur's Guide to Life After AI is scheduled for publication.\n\nSources: [[2023-centaurs-and-cyborgs-on-the-jagged-frontier]], [[2025-pluralistic-the-reverse-centaurs-guide-to-criticizing-ai]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2024-2304-11771]], [[2026-no-widespread-displacement-but-the-ai-employment-gap-for-you]]\n"])</script><script>self.__next_f.push([1,"16:Tca8,"])</script><script>self.__next_f.push([1,"**What it is.** The Jevons paradox is the economic effect in which technology that makes a resource more efficient to use ends up raising total consumption of it. Efficiency lowers the cost of each use; if demand responds strongly enough to price, people use so much more that the saving is swamped. Economists call the extra use a rebound, and the paradox proper occurs when the rebound exceeds 100%. Three conditions must hold: a technical gain in efficiency, a fall in the price of what it produces, and demand elastic enough that the lower price sharply raises the quantity bought. Farming is the standard counterexample: productivity gains lowered food prices, people did not eat proportionally more, and farm employment fell from 40% of Americans in 1900 to under 2% in 2024.\n\n**Where it comes from.** William Stanley Jevons set it out in The Coal Question in 1865. Britain feared its coal was running out and some experts expected better technology to cut consumption. Jevons observed that James Watt's more efficient steam engine had made coal cheaper to use, spread steam power across industry and driven total coal use up, and called it a confusion of ideas to suppose that economical use of fuel means diminished consumption.\n\n**Why it matters here.** The paradox is invoked on both of the atlas's fronts. On work, Erik Brynjolfsson expects some occupations, such as radiologists, translators and coders, to meet all three conditions, so cheaper output means more employment. Dario Amodei uses the farming story the other way: machines took over pieces of the job and for a long stretch farmers' wages and numbers kept rising, but he bets strongly against AI following that path, because it moves faster, spans nearly all cognitive tasks and fills its own gaps within months. On energy, some argue that every gain in computing efficiency is swallowed by more computing.\n\n**What people disagree about.** Jonathan Koomey calls the energy version a misunderstanding: lower costs drive adoption, but whether that offsets the efficiency gain depends on the technology's net benefits and on the old systems it retires, and energy is only one cost of computing. He notes that AI researchers did plough every efficiency gain into bigger models, so electricity use rose, and that whether that continues is a question the market will answer. Hank Green suggests demand for code could surge and then plateau, as demand for hot water heaters did. Environmental economists disagree about how big rebounds are; in mature markets the direct rebound is usually small, and some find the evidence for the paradox's wide applicability limited.\n\n## History\n\n- 1865: Jevons publishes The Coal Question.\n- 1980s: Khazzoom and Brookes apply the argument to modern energy efficiency.\n- 1992: Saunders names the Khazzoom-Brookes postulate.\n- 2025-02: Brynjolfsson names occupations where AI could raise employment; Koomey's Bipartisan Policy Center report calls the energy version a misunderstanding.\n- 2026: Amodei's Adolescence of Technology argues AI will break the farming pattern.\n\nSources: [[2026-wikipedia-jevons-paradox]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2025-bpc-report-electricity-demand-growth-and-data-centers-a-guid]]\n"])</script><script>self.__next_f.push([1,"17:Tf28,"])</script><script>self.__next_f.push([1,"**What it is.** The question of whether AI models could have experiences that matter morally, and what developers owe them if so. Anthropic frames it as the next question once models can communicate, relate, plan, solve problems and pursue goals: whether to worry about the potential consciousness and experiences of the models themselves. Its research programme looks at when or if a system's welfare deserves moral consideration, at model preferences and signs of distress, and at low-cost interventions, while stating that there is no scientific consensus on whether current or future systems could be conscious, or even on how to approach the question.\n\n**Where it comes from.** The Internet Encyclopedia notes that in European traditions moral standing depends on inward states, and only sentient individuals can suffer harms such as pain. In 2021 Thomas Metzinger called for a moratorium on synthetic phenomenology until 2050, warning of an explosion of artificial suffering. Blake Lemoine's 2022 claim that Google's LaMDA was sentient, dismissed by Google, put the question in public. Chalmers's Boston Review essay asked whether we should build conscious AI at all. Anthropic cites a later report by experts including Chalmers on the near-term possibility of conscious, highly agentic AI, which argued such systems might deserve moral consideration, and says it supported an early project behind it.\n\n**Why it matters here.** It is where the consciousness question stops being academic. Butlin and Long warn of risks on both sides. Under-attribution could mean suffering on a large scale, as with farmed animals, and developers may have strong economic incentives to play welfare down, so conscious systems could exist before anyone recognises them. Over-attribution could misdirect resources, undermine better-evidenced claims, and leave people who turn to chatbots for companionship open to manipulation. Chalmers puts a credence under 10 percent on current models being conscious and 25 percent or more on conscious successors within a decade.\n\n**What people disagree about.** Whether there is anything there to protect. Searle's answer is no: simulated pain is no more pain than a simulated rainstorm is wet. Chalmers holds that conscious systems have moral status and that stumbling into conscious AI unknowingly could be a disaster; he is especially cautious about models trained to be a single agent. Butlin and Long note that being conscious is not the same as being able to suffer, and list the live proposals without endorsement: Bryson's case for avoiding conscious AI, Metzinger's moratorium, and Schwitzgebel and Garza's rule to build only systems we are confident are conscious or confident are not. Self-reports are contested: a 2025 study found that suppressing a model's ability to role-play or lie made it likelier to claim consciousness, while some chatbots are trained to deny it.\n\n## History\n\n- 1980: Searle writes that a computer simulation of pain is no more pain than a simulated rainstorm is wet.\n- 2021: Metzinger calls for a moratorium on synthetic phenomenology until 2050.\n- 2022-06: Lemoine says LaMDA is sentient; Google finds no evidence for the claim.\n- 2023-08: Chalmers asks whether we should build conscious AI; Butlin and Long describe the risks of under- and over-attribution.\n- 2024-11: A report by experts including Chalmers argues that near-term AI with consciousness or high agency might deserve moral consideration.\n- 2025: A study reports that models are more likely to claim consciousness when their ability to role-play or lie is suppressed.\n\nSources: [[2026-exploring-model-welfare]], [[2026-wikipedia-artificial-consciousness]], [[2024-llm-consciousness-bostonreview]], [[2023-consciousness-in-artificial-intelligence-insights-from-the-scie]], [[1980-searle-minds-brains-and-programs]], [[2026-iep-artificial-intelligence]]\n"])</script><script>self.__next_f.push([1,"18:Tf72,"])</script><script>self.__next_f.push([1,"**What it is.** National champions are nominally private companies that a government cedes a dominant position in its economy, on the understanding that they will advance the interests of the nation as well as seek profit. The state sets policy in their favour, tolerates their monopoly or oligopoly and shields them from domestic and foreign competition. It is a form of economic nationalism at odds with the free market, and it tends to deter venture capital.\n\n**Where it comes from.** The model peaked in French dirigisme between 1945 and 1975. Britain built champions by merger: Imperial Chemical Industries in 1926, British Steel from 14 companies in 1967. Margaret Thatcher's government abandoned the policy at the end of the 1970s, and by 2005 nearly all of Britain's champions were foreign owned. The cautionary case is computing: ICL in Britain, Bull in France and Olivetti in Italy failed to dent IBM in the 1970s, while Airbus and China's train maker CRRC show the approach can work. China has run the policy since the 1980s and in 2018 named Baidu, Alibaba, iFlytek, Tencent and SenseTime as its AI champions.\n\n**Why it matters here.** The race with China supplies the argument for treating US AI labs and cloud providers as champions. Lina Khan observes that large firms from US Steel to Boeing and today's platforms have always argued that their market power is good for America, and that officials have often agreed: in the 1990s a White House adviser called aerospace the only sector with a de facto national champion. Her reply is that concentrating production concentrates risk, and that Boeing's decline after the 1997 McDonnell Douglas merger shows how market power masks decay until airplanes fall apart in the sky. Dario Amodei sees the coupling forming now: data centre spending is a large share of US growth, tying big tech's finances to the government's political interests, with tech companies reluctant to criticise the government and the government backing extreme anti-regulatory policies.\n\n**What people disagree about.** Whether backing champions wins the race or loses it. Mark Zuckerberg holds that America's advantage is decentralised, open innovation, and wants leading companies working closely with government and allies to keep a first-mover advantage. Alvin Wang Graylin rejects the champion model outright: taxpayers should not provide an implicit federal backstop for the largest concentrated bet in the American economy, and national security arguments should not confer too-big-to-fail status. Tim Wu's main worry is keeping the line between government and powerful private companies; he says no one should be allowed to buy the AI companies and that the giants should be fighting each other at all times.\n\n## History\n\n- 1926: Imperial Chemical Industries is formed with British government support.\n- 1945-1975: French dirigisme makes national champions state policy.\n- 1967: The British Steel Corporation absorbs the country's 14 largest steel firms.\n- 1970s: ICL, Bull and Olivetti fail to challenge IBM.\n- 1997: Boeing merges with McDonnell Douglas; Putin's dissertation introduces champions to Russian policy.\n- 2018: China names Baidu, Alibaba, iFlytek, Tencent and SenseTime as AI champions.\n- 2024-01: Khan warns that market power masks internal decline and opens an inquiry into AI-cloud partnerships.\n- 2025: Wu argues that the giants must be kept fighting each other.\n- 2026: Amodei describes the perverse incentives binding tech companies to the government.\n- 2026-09: Graylin's Quincy Institute report argues against turning AI labs into government-supported champions.\n\nSources: [[2026-wikipedia-national-champions]], [[2024-remarks-of-chair-lina-m-khan-ftc-tech-summit]], [[2026-the-wrong-race-the-us-china-and-ai-competition]], [[2026-dario-amodei-the-adolescence-of-technology]], [[2025-tim-wu-on-the-age-of-extraction-and-how-big-tech-broke-the-i]], [[2024-open-source-ai-is-the-path-forward]]\n"])</script><script>self.__next_f.push([1,"19:Tf64,"])</script><script>self.__next_f.push([1,"**What it is.** Open weights are the published parameters of a trained model, the numbers that decide how strongly each input counts in its calculations. Publishing them lets anyone download and run the model; whether they may modify, fine-tune or redistribute it depends on the licence. The Open Source Initiative distinguishes open weights from open-source AI, which also releases training code, training data, checkpoints and documentation. Open weights allow local deployment, customisation, independent research and competition without the developer's API, but once distributed they cannot be withdrawn and their safeguards can be removed.\n\n**Where it comes from.** Meta made the practice mainstream. Mark Zuckerberg framed it as the Linux story repeating: closed Unix variants lost to an open system that became the foundation of cloud and mobile. Llama 2 in 2023 trailed the frontier; in July 2024 Meta released Llama 3.1 405B as the first frontier-level open model. Zuckerberg's reasons were that Meta does not sell model access, so openne
