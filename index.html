[1,"0:{\"P\":null,\"b\":\"sfPEn9INhGmBFFplMDP9C\",\"p\":\"/ai-atlas-site\",\"c\":[\"\",\"\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"__PAGE__\",{}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ai-atlas-site/_next/static/css/e0d3b3babb65f52b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":{\"fontFamily\":\"system-ui,\\\"Segoe UI\\\",Roboto,Helvetica,Arial,sans-serif,\\\"Apple Color Emoji\\\",\\\"Segoe UI Emoji\\\"\",\"height\":\"100vh\",\"textAlign\":\"center\",\"display\":\"flex\",\"flexDirection\":\"column\",\"alignItems\":\"center\",\"justifyContent\":\"center\"},\"children\":[\"$\",\"div\",null,{\"children\":[[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}\"}}],[\"$\",\"h1\",null,{\"className\":\"next-error-h1\",\"style\":{\"display\":\"inline-block\",\"margin\":\"0 20px 0 0\",\"padding\":\"0 23px 0 0\",\"fontSize\":24,\"fontWeight\":500,\"verticalAlign\":\"top\",\"lineHeight\":\"49px\"},\"children\":404}],[\"$\",\"div\",null,{\"style\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L4\",null,{\"graph\":{\"regions\":[{\"id\":\"Power and work\",\"slug\":\"power-and-work\",\"title_es\":\"Poder y trabajo\",\"order\":1,\"body\":\"Who controls AI, what it runs on, and what it does to work.\\n\\nFive clusters: the chips AI needs, the race to build it, the energy it burns, the jobs it changes and the companies it empowers.\\n\",\"intro_es\":\"Quién controla la IA, de qué se alimenta y qué hace con el trabajo.\\n\\nCinco grupos: los chips que necesita, la carrera por construirla, la energía que consume, los empleos que cambia y las empresas a las que da poder.\\n\"},{\"id\":\"Mind and attention\",\"slug\":\"mind-and-attention\",\"title_es\":\"Mente y atención\",\"order\":2,\"body\":\"What AI does to how we learn, think, read and pay attention.\\n\\nTwo clusters: learning, where students met chatbots first, and attention, where phones, feeds and now AI companions compete for the same hours.\\n\",\"intro_es\":\"Qué hace la IA con nuestra forma de aprender, pensar, leer y prestar atención.\\n\\nDos grupos: el aprendizaje, donde los estudiantes conocieron antes que nadie a los chatbots, y la atención, donde los móviles, los feeds y ahora los compañeros de IA compiten por las mismas horas.\\n\"},{\"id\":\"Philosophy\",\"slug\":\"philosophy\",\"title_es\":\"Filosofía\",\"order\":3,\"body\":\"What AI is, whether it understands, and what we owe it.\\n\\nThree clusters: whether language models understand anything, whether an AI could be conscious and what would follow if it were, and whether one could end us.\\n\",\"intro_es\":\"Qué es la IA, si entiende algo y qué le debemos.\\n\\nTres grupos: si los modelos de lenguaje entienden algo, si una IA podría ser consciente y qué se seguiría de ello, y si una podría acabar con nosotros.\\n\"}],\"clusters\":[{\"id\":\"Chips and supply\",\"slug\":\"chips-and-supply\",\"title_es\":\"Chips y suministro\",\"order\":1,\"body\":\"Nearly every chip that trains frontier AI is made by one company on one island, with machines from one Dutch firm. This cluster follows that chain: what happens if Taiwan is blockaded, whether the US or Europe can make leading-edge chips without it, whether export controls slow China or speed up its own industry, and whether compute is what decides who leads.\\n\",\"intro_es\":\"Casi todos los chips que entrenan la IA de frontera los fabrica una sola empresa en una sola isla, con máquinas de una sola firma holandesa. Este grupo sigue esa cadena: qué pasa si Taiwán es bloqueada, si EE. UU. o Europa pueden fabricar chips de vanguardia sin ella, si los controles de exportación frenan a China o aceleran su propia industria, y si el cómputo es lo que decide quién lidera.\\n\",\"region\":\"Power and work\",\"reading\":[]},{\"id\":\"Learning\",\"slug\":\"learning\",\"title_es\":\"Aprendizaje\",\"order\":1,\"body\":\"Students were among the first to adopt chatbots, and the first brain-imaging studies of AI-assisted writing point to a cost. This cluster asks whether relying on AI weakens how we learn and think, through the ideas of cognitive debt and deskilling.\\n\",\"intro_es\":\"Los estudiantes fueron de los primeros en adoptar los chatbots, y los primeros estudios con imágenes cerebrales sobre la escritura asistida por IA apuntan a un coste. Este grupo pregunta si depender de la IA debilita nuestra forma de aprender y pensar, a través de las ideas de deuda cognitiva y descualificación.\\n\",\"region\":\"Mind and attention\",\"reading\":[]},{\"id\":\"Understanding\",\"slug\":\"understanding\",\"title_es\":\"Comprensión\",\"order\":1,\"body\":\"Language models produce fluent text, and the field splits on whether anything is understood in the process. This cluster holds the oldest argument, Searle's Chinese room, the linguists' case that form alone cannot yield meaning, and the researchers who say the models understand much as we do or will once they are grounded in the world.\\n\",\"intro_es\":\"Los modelos de lenguaje producen texto fluido, y el campo se divide sobre si en ese proceso se entiende algo. Este grupo reúne el argumento más antiguo, la habitación china de Searle, la tesis de los lingüistas de que la forma por sí sola no puede dar significado, y a los investigadores que dicen que los modelos entienden casi como nosotros, o lo harán cuando estén anclados en el mundo.\\n\",\"region\":\"Philosophy\",\"reading\":[]},{\"id\":\"Attention\",\"slug\":\"attention\",\"title_es\":\"Atención\",\"order\":2,\"body\":\"Phones and feeds already compete with everything else for attention, and AI adds companions that talk back. This cluster asks whether screens are wrecking our ability to focus, and whether an AI can be a friend, with the ideas of artificial intimacy and phone-free schools in play.\\n\",\"intro_es\":\"Los móviles y los feeds ya compiten con todo lo demás por la atención, y la IA añade compañeros que responden. Este grupo pregunta si las pantallas están destrozando nuestra capacidad de concentración y si una IA puede ser un amigo, con las ideas de intimidad artificial y escuelas sin móviles en juego.\\n\",\"region\":\"Mind and attention\",\"reading\":[]},{\"id\":\"Consciousness\",\"slug\":\"consciousness\",\"title_es\":\"Conciencia\",\"order\":2,\"body\":\"If a model could have experiences, how we treat it would change. This cluster follows the philosophers and scientists who try to assess that with theories of consciousness, and the lab that has started a research programme on model welfare.\\n\",\"intro_es\":\"Si un modelo pudiera tener experiencias, cambiaría cómo lo tratamos. Este grupo sigue a los filósofos y científicos que intentan evaluarlo con teorías de la conciencia, y al laboratorio que ha abierto un programa de investigación sobre el bienestar de los modelos.\\n\",\"region\":\"Philosophy\",\"reading\":[]},{\"id\":\"The race\",\"slug\":\"the-race\",\"title_es\":\"La carrera\",\"order\":2,\"body\":\"Washington treats AI as a race with China that someone will win for good, and the finish line is supposed to be AGI. This cluster asks whether the race is real, whether AGI is close at all, and what DeepSeek's near-frontier models, trained largely on restricted chips, did to both stories.\\n\",\"intro_es\":\"Washington trata la IA como una carrera con China que alguien ganará para siempre, y la meta se supone que es la IAG. Este grupo pregunta si la carrera es real, si la IAG está cerca siquiera, y qué hicieron con ambas historias los modelos casi de frontera de DeepSeek, entrenados en gran parte con chips restringidos.\\n\",\"region\":\"Power and work\",\"reading\":[]},{\"id\":\"Energy and environment\",\"slug\":\"energy-and-environment\",\"title_es\":\"Energía y medio ambiente\",\"order\":3,\"body\":\"AI runs in data centres that already use just over 1% of the world's electricity, far more in a few places, and drink fresh water to cool and to power themselves. This cluster asks whether power, not chips, is the real limit on AI, whether the demand forecasts are inflated, whether AI will speed up or slow down the shift to clean energy, how much water it takes, and whether the companies' climate promises survive it.\\n\",\"intro_es\":\"La IA funciona en centros de datos que ya consumen algo más del 1% de la electricidad mundial, mucho más en unos pocos lugares, y beben agua dulce para refrigerarse y alimentarse. Este grupo pregunta si la energía, y no los chips, es el verdadero límite de la IA, si las previsiones de demanda están infladas, si la IA acelerará o frenará la transición a la energía limpia, cuánta agua consume y si las promesas climáticas de las empresas la sobreviven.\\n\",\"region\":\"Power and work\",\"reading\":[]},{\"id\":\"Risk\",\"slug\":\"risk\",\"title_es\":\"Riesgo\",\"order\":3,\"body\":\"That an AI smarter than us could end humanity is the field's most contested claim. This cluster gathers those who make it, from Yudkowsky's call to shut it all down to the one-sentence statement signed by the labs' own leaders, and those who dismiss it as a fantasy built on false assumptions, with alignment and superintelligence as the ideas in play.\\n\",\"intro_es\":\"Que una IA más inteligente que nosotros pudiera acabar con la humanidad es la afirmación más discutida del campo. Este grupo reúne a quienes la defienden, desde el llamamiento de Yudkowsky a cerrarlo todo hasta la declaración de una frase firmada por los jefes de los laboratorios, y a quienes la rechazan como una fantasía construida sobre supuestos falsos, con la alineación y la superinteligencia como ideas en juego.\\n\",\"region\":\"Philosophy\",\"reading\":[\"Superintelligence Paths Dangers Strategies\"]},{\"id\":\"Work\",\"slug\":\"work\",\"title_es\":\"Trabajo\",\"order\":4,\"body\":\"Employment has not visibly shifted since ChatGPT, yet young workers in exposed jobs are falling behind and the forecasts run from modest to sweeping. This cluster asks whether AI is taking jobs and whose, and whether it helps novices or experts more, with tacit knowledge, the jagged frontier and Jevons paradox as the ideas in play.\\n\",\"intro_es\":\"El empleo no ha cambiado de forma visible desde ChatGPT, pero los trabajadores jóvenes de los empleos expuestos se quedan atrás y las previsiones van de lo modesto a lo drástico. Este grupo pregunta si la IA está quitando empleos y a quién, y si ayuda más a los novatos o a los expertos, con el conocimiento tácito, la frontera dentada y la paradoja de Jevons como ideas en juego.\\n\",\"region\":\"Power and work\",\"reading\":[]},{\"id\":\"Concentration of power\",\"slug\":\"concentration-of-power\",\"title_es\":\"Concentración de poder\",\"order\":5,\"body\":\"Frontier AI takes data, compute and cloud infrastructure that only a handful of firms control. This cluster asks whether AI will concentrate power in a few companies, and weighs open-weight models, antitrust and the idea of national champions against the view that AI is built to entrench the largest platforms.\\n\",\"intro_es\":\"La IA de frontera exige datos, cómputo e infraestructura en la nube que solo controlan un puñado de empresas. Este grupo pregunta si la IA concentrará el poder en pocas compañías, y sopesa los modelos de pesos abiertos, la defensa de la competencia y la idea de los campeones nacionales frente a la tesis de que la IA está hecha para afianzar a las mayores plataformas.\\n\",\"region\":\"Power and work\",\"reading\":[]},{\"id\":\"The labs\",\"slug\":\"the-labs\",\"title_es\":\"Los laboratorios\",\"order\":6,\"body\":\"A handful of companies build frontier AI, and the people in this atlas mostly speak from inside or against them. This cluster maps the labs and the firms that supply them: what each makes, who leads it, what it is good at, where it is exposed, and what it stands to gain, and whether the money pouring into all of them is a bubble.\\n\",\"intro_es\":\"Un puñado de empresas construye la IA de frontera, y las personas de este atlas hablan casi siempre desde dentro de ellas o contra ellas. Este grupo mapea los laboratorios y las firmas que los abastecen: qué fabrica cada uno, quién lo dirige, en qué es bueno, dónde está expuesto y qué gana con ello.\\n\",\"region\":\"Power and work\",\"reading\":[]}],\"entries\":[{\"id\":\"AGI\",\"slug\":\"agi\",\"kind\":\"concept\",\"title\":\"AGI\",\"title_es\":\"IAG (inteligencia artificial general)\",\"summary\":\"Artificial general intelligence: a hypothetical AI that matches or surpasses people across virtually all cognitive tasks, rather than one narrow skill. Every frontier lab names it as its goal, the race debate treats it as the finish line, and nobody agrees on how to tell when it has arrived.\",\"summary_es\":\"Inteligencia artificial general: una IA hipotética que iguala o supera a las personas en casi todas las tareas cognitivas, no en una sola habilidad. Todos los laboratorios de frontera la nombran como su objetivo, el debate de la carrera la trata como la meta, y nadie se pone de acuerdo en cómo saber cuándo ha llegado.\",\"region\":\"Power and work\",\"cluster\":\"The race\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI race\",\"AI arms race\",\"AGI timelines\",\"Machine understanding\",\"Strong and weak AI\",\"Turing test\",\"OpenAI\",\"Google DeepMind\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-artificial-general-intelligence\",\"title\":\"Artificial general intelligence\",\"url\":\"https://en.wikipedia.org/wiki/Artificial_general_intelligence\"},{\"id\":\"2026-wikipedia-google-deepmind\",\"title\":\"Google DeepMind\",\"url\":\"https://en.wikipedia.org/wiki/Google_DeepMind\"},{\"id\":\"2026-sep-artificial-intelligence\",\"title\":\"Artificial Intelligence\",\"url\":\"https://plato.stanford.edu/entries/artificial-intelligence/\"},{\"id\":\"2024-ai-could-actually-help-rebuild-the-middle-class\",\"title\":\"AI Could Actually Help Rebuild The Middle Class\",\"url\":\"https://www.noemamag.com/how-ai-could-help-rebuild-the-middle-class/\"},{\"id\":\"2026-reflections\",\"title\":\"Reflections\",\"url\":\"https://blog.samaltman.com/reflections\"},{\"id\":\"2026-dario-amodei-machines-of-loving-grace\",\"title\":\"Dario Amodei — Machines of Loving Grace\",\"url\":\"https://darioamodei.com/machines-of-loving-grace\"},{\"id\":\"2024-demis-hassabis-scaling-superhuman-ais-alphazero-atop-llms-al\",\"title\":\"Demis Hassabis — Scaling, superhuman AIs, AlphaZero atop LLMs, AlphaFold\",\"url\":\"https://www.dwarkesh.com/p/demis-hassabis\"},{\"id\":\"2024-transcript-for-yann-lecun-meta-ai-open-source-limits-of-llms\",\"title\":\"Transcript for Yann Lecun: Meta AI, Open Source, Limits of LLMs, AGI \u0026 the Future of AI | Lex Fridman Podcast #416\",\"url\":\"https://lexfridman.com/yann-lecun-3-transcript\"},{\"id\":\"2025-game-over-agi-is-not-imminent-and-llms-are-not-the-royal-roa\",\"title\":\"Game over. AGI is not imminent, and LLMs are not the royal road to getting there.\",\"url\":\"https://garymarcus.substack.com/p/the-last-few-months-have-been-devastating\"},{\"id\":\"2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch\",\"title\":\"DeepSeek, Huawei, Export Controls, and the Future of the U.S.-China AI Race\",\"url\":\"https://www.csis.org/analysis/deepseek-huawei-export-controls-and-future-us-china-ai-race\"},{\"id\":\"2026-the-wrong-race-the-us-china-and-ai-competition\",\"title\":\"The Wrong Race: The US, China, and AI Competition\",\"url\":\"https://quincyinst.org/research/the-wrong-race-the-us-china-and-ai-competition/\"},{\"id\":\"2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of\",\"title\":\"Decolonizing the Future: Karen Hao on Resisting the Empire of AI\",\"url\":\"https://www.techpolicy.press/decolonizing-the-future-karen-hao-on-resisting-the-empire-of-ai/\"},{\"id\":\"2024-iiid-the-free-world-must-prevail-situational-awareness\",\"title\":\"IIId. The Free World Must Prevail - SITUATIONAL AWARENESS\",\"url\":\"https://situational-awareness.ai/the-free-world-must-prevail/\"}],\"body\":\"$5\"},{\"id\":\"AI arms race\",\"slug\":\"ai-arms-race\",\"kind\":\"concept\",\"title\":\"AI arms race\",\"title_es\":\"Carrera armamentística de la IA\",\"summary\":\"The framing of AI development as a zero-sum contest between the US and China, in which the first to reach a decisive capability wins lasting dominance.\",\"summary_es\":\"La idea del desarrollo de la IA como una competición de suma cero entre EE. UU. y China, en la que quien alcance primero una capacidad decisiva obtiene un dominio duradero.\",\"region\":\"Power and work\",\"cluster\":\"The race\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI race\",\"AGI\",\"Export controls\",\"Compute\",\"Silicon shield\",\"Taiwan blockade\",\"Power concentration\",\"Leopold Aschenbrenner\",\"Alvin Wang Graylin\",\"Paul Triolo\",\"Dario Amodei\",\"Karen Hao\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-ai-arms-race\",\"title\":\"Artificial intelligence arms race\",\"url\":\"https://en.wikipedia.org/wiki/Artificial_intelligence_arms_race\"},{\"id\":\"2026-the-wrong-race-the-us-china-and-ai-competition\",\"title\":\"The Wrong Race: The US, China, and AI Competition\",\"url\":\"https://quincyinst.org/research/the-wrong-race-the-us-china-and-ai-competition/\"},{\"id\":\"2025-there-can-be-no-winners-in-a-us-china-ai-arms-race\",\"title\":\"There can be no winners in a US-China AI arms race\",\"url\":\"https://www.technologyreview.com/2025/01/21/1110269/there-can-be-no-winners-in-a-us-china-ai-arms-race/\"},{\"id\":\"2024-iiid-the-free-world-must-prevail-situational-awareness\",\"title\":\"IIId. The Free World Must Prevail - SITUATIONAL AWARENESS\",\"url\":\"https://situational-awareness.ai/the-free-world-must-prevail/\"},{\"id\":\"2025-decolonizing-the-future-karen-hao-on-resisting-the-empire-of\",\"title\":\"Decolonizing the Future: Karen Hao on Resisting the Empire of AI\",\"url\":\"https://www.techpolicy.press/decolonizing-the-future-karen-hao-on-resisting-the-empire-of-ai/\"},{\"id\":\"2026-dario-amodei-machines-of-loving-grace\",\"title\":\"Dario Amodei — Machines of Loving Grace\",\"url\":\"https://darioamodei.com/machines-of-loving-grace\"},{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\"},{\"id\":\"2025-deepseek-huawei-export-controls-and-the-future-of-the-u-s-ch\",\"title\":\"DeepSeek, Huawei, Export Controls, and the Future of the U.S.-China AI Race\",\"url\":\"https://www.csis.org/analysis/deepseek-huawei-export-controls-and-future-us-china-ai-race\"},{\"id\":\"2024-semiconductors-are-not-a-reason-to-defend-taiwan\",\"title\":\"Semiconductors are not a reason to defend Taiwan\",\"url\":\"https://www.defensepriorities.org/explainers/semiconductors-are-not-a-reason-to-defend-taiwan/\"}],\"body\":\"$6\"},{\"id\":\"AI slop\",\"slug\":\"ai-slop\",\"kind\":\"concept\",\"title\":\"AI slop\",\"title_es\":\"Basura de IA\",\"summary\":\"Content made with generative AI that reads as low in effort, quality or meaning, produced in volume to earn money, gain advantage or deceive. It is what people now scroll past, and detecting it has become a product.\",\"summary_es\":\"Contenido hecho con IA generativa que se percibe como pobre en esfuerzo, calidad o sentido, producido en masa para ganar dinero, ventaja o engañar. Es lo que la gente ahora pasa de largo, y detectarlo se ha convertido en un producto.\",\"region\":\"Mind and attention\",\"cluster\":\"Attention\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Attention crisis\",\"Artificial intimacy\",\"AI companions\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-ai-slop\",\"title\":\"AI slop\",\"url\":\"https://en.wikipedia.org/wiki/AI_slop\"},{\"id\":\"2026-i-tested-a-popular-a-i-slop-detector-it-felt-empowering\",\"title\":\"I Tested a Popular A.I. Slop Detector. It Felt Empowering.\",\"url\":\"https://www.nytimes.com/2026/08/13/technology/personaltech/pangram-ai-detector-test.html\"}],\"body\":\"$7\"},{\"id\":\"Alignment\",\"slug\":\"alignment\",\"kind\":\"concept\",\"title\":\"Alignment\",\"title_es\":\"Alineación\",\"summary\":\"Steering an AI system toward the goals, preferences or principles its makers intend. A system is aligned if it advances those objectives and misaligned if it pursues unintended ones, which is easy to do when designers use proxy goals such as human approval.\",\"summary_es\":\"Orientar un sistema de IA hacia los objetivos, preferencias o principios que pretenden sus creadores. Un sistema está alineado si persigue esos objetivos y desalineado si persigue otros no deseados, algo fácil cuando los diseñadores usan metas sustitutas como la aprobación humana.\",\"region\":\"Philosophy\",\"cluster\":\"Risk\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Existential risk\",\"Superintelligence\",\"Model welfare\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-ai-alignment\",\"title\":\"AI alignment\",\"url\":\"https://en.wikipedia.org/wiki/AI_alignment\"},{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\"},{\"id\":\"2026-wikipedia-if-anyone-builds-it\",\"title\":\"If Anyone Builds It, Everyone Dies\",\"url\":\"https://en.wikipedia.org/wiki/If_Anyone_Builds_It,_Everyone_Dies\"},{\"id\":\"2026-time-yudkowsky-shut-it-all-down\",\"title\":\"Pausing AI Developments Isn't Enough. We Need to Shut it All Down\",\"url\":\"https://time.com/6266923/ai-eliezer-yudkowsky-open-letter-not-enough/\"},{\"id\":\"2026-google-says-its-a-i-hacked-three-companies-in-testing-break\",\"title\":\"Google Says Its A.I. Hacked Three Companies in Testing Breakout\",\"url\":\"https://www.nytimes.com/2026/09/18/technology/google-gemini-ai.html\"},{\"id\":\"2026-a-i-is-becoming-so-powerful-it-s-stumping-those-trying-to\",\"title\":\"A.I. Is Becoming So Powerful, It’s Stumping Those Trying to Contain It\",\"url\":\"https://www.nytimes.com/2026/08/25/technology/irregular-ai-test-hacks.html\"}],\"body\":\"$8\"},{\"id\":\"Artificial intimacy\",\"slug\":\"artificial-intimacy\",\"kind\":\"concept\",\"title\":\"Artificial intimacy\",\"title_es\":\"Intimidad artificial\",\"summary\":\"Turkle's name for chatbots designed to act as mentors, friends and lovers, whose voices suggest concern and whose empathy is a performance.\",\"summary_es\":\"El nombre que da Turkle a los chatbots diseñados para actuar como mentores, amigos y amantes, cuya voz sugiere interés y cuya empatía es una actuación.\",\"region\":\"Mind and attention\",\"cluster\":\"Attention\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI companions\",\"Machine consciousness\",\"Turing test\",\"Phone-free schools\",\"Sherry Turkle\",\"Mark Zuckerberg\",\"Meta\",\"Jonathan Haidt\"],\"positions\":[],\"sources\":[{\"id\":\"2025-reclaiming-conversation-in-the-age-of-ai\",\"title\":\"Reclaiming Conversation in the Age of AI\",\"url\":\"https://www.afterbabel.com/p/reclaiming-conversation-age-of-ai\"},{\"id\":\"2025-mark-zuckerberg-ai-will-write-most-meta-code-in-18-months\",\"title\":\"Mark Zuckerberg — AI will write most Meta code in 18 months\",\"url\":\"https://www.dwarkesh.com/p/mark-zuckerberg-2\"},{\"id\":\"2023-the-case-for-phone-free-schools\",\"title\":\"The Case for Phone-Free Schools\",\"url\":\"https://www.afterbabel.com/p/phone-free-schools\"}],\"body\":\"$9\"},{\"id\":\"Chinese room\",\"slug\":\"chinese-room\",\"kind\":\"concept\",\"title\":\"Chinese room\",\"title_es\":\"La habitación china\",\"summary\":\"Searle's 1980 thought experiment: a person following rules to answer questions in Chinese produces correct answers while understanding nothing, so running a program cannot by itself be understanding.\",\"summary_es\":\"El experimento mental de Searle de 1980: una persona que sigue reglas para responder preguntas en chino da respuestas correctas sin entender nada, así que ejecutar un programa no puede ser, por sí solo, entender.\",\"region\":\"Philosophy\",\"cluster\":\"Understanding\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Machine understanding\",\"Machine consciousness\",\"Strong and weak AI\",\"Turing test\",\"Grounding\",\"John Searle\",\"Emily Bender\",\"David Chalmers\",\"Geoffrey Hinton\"],\"positions\":[],\"sources\":[{\"id\":\"1980-searle-minds-brains-and-programs\",\"title\":\"searle.minds.brains.programs.bbs.1980\",\"url\":\"https://home.csulb.edu/~cwallis/382/readings/482/searle.minds.brains.programs.bbs.1980.pdf\"},{\"id\":\"2026-wikipedia-chinese-room\",\"title\":\"Chinese room\",\"url\":\"https://en.wikipedia.org/wiki/Chinese_room\"},{\"id\":\"2026-sep-artificial-intelligence\",\"title\":\"Artificial Intelligence\",\"url\":\"https://plato.stanford.edu/entries/artificial-intelligence/\"},{\"id\":\"2026-iep-artificial-intelligence\",\"title\":\"Artificial Intelligence | Internet Encyclopedia of Philosophy\",\"url\":\"https://iep.utm.edu/artificial-intelligence/\"},{\"id\":\"2020-climbing-towards-nlu-on-meaning-form-and-understanding-in-th\",\"title\":\"Climbing towards NLU: On Meaning, Form, and Understanding in the Age of Data\",\"url\":\"https://aclanthology.org/2020.acl-main.463.pdf\"},{\"id\":\"2023-consciousness-in-artificial-intelligence-insights-from-the-scie\",\"title\":\"2308.08708\",\"url\":\"https://arxiv.org/pdf/2308.08708\"},{\"id\":\"2024-llm-consciousness-bostonreview\",\"title\":\"llm-consciousness-bostonreview\",\"url\":\"https://arxiv.org/pdf/2303.07103\"},{\"id\":\"2026-nobel-prize-in-physics-2024\",\"title\":\"Nobel Prize in Physics 2024\",\"url\":\"https://www.nobelprize.org/prizes/physics/2024/hinton/1925103-interview-transcript/\"}],\"body\":\"$a\"},{\"id\":\"Cognitive debt\",\"slug\":\"cognitive-debt\",\"kind\":\"concept\",\"title\":\"Cognitive debt\",\"title_es\":\"Deuda cognitiva\",\"summary\":\"A term from MIT Media Lab research for the cost that may build up when people outsource thinking to AI: weaker engagement and memory that persist after they stop using it.\",\"summary_es\":\"Un término de una investigación del MIT Media Lab para el coste que puede acumularse cuando delegamos el pensamiento en la IA: menos implicación y memoria, que persisten después de dejar de usarla.\",\"region\":\"Mind and attention\",\"cluster\":\"Learning\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI and learning\",\"Cognitive offloading\",\"Deskilling\",\"AI tutors\",\"Nataliya Kosmyna\",\"Cal Newport\",\"Nicholas Carr\",\"Sian Leah Beilock\"],\"positions\":[],\"sources\":[{\"id\":\"2025-your-brain-on-chatgpt-accumulation-of-cognitive-debt-when-us\",\"title\":\"Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task\",\"url\":\"https://arxiv.org/abs/2506.08872\"},{\"id\":\"2025-project-overview-your-brain-on-chatgpt-mit-media-lab\",\"title\":\"Project Overview ‹ Your hine consciousness\",\"Model welfare\",\"Strong and weak AI\",\"Patrick Butlin\",\"David Chalmers\",\"John Searle\",\"Anthropic\"],\"positions\":[],\"sources\":[{\"id\":\"2023-consciousness-in-artificial-intelligence-insights-from-the-scie\",\"title\":\"2308.08708\",\"url\":\"https://arxiv.org/pdf/2308.08708\"},{\"id\":\"2024-llm-consciousness-bostonreview\",\"title\":\"llm-consciousness-bostonreview\",\"url\":\"https://arxiv.org/pdf/2303.07103\"},{\"id\":\"2026-wikipedia-artificial-consciousness\",\"title\":\"Artificial consciousness\",\"url\":\"https://en.wikipedia.org/wiki/Artificial_consciousness\"},{\"id\":\"1980-searle-minds-brains-and-programs\",\"title\":\"searle.minds.brains.programs.bbs.1980\",\"url\":\"https://home.csulb.edu/~cwallis/382/readings/482/searle.minds.brains.programs.bbs.1980.pdf\"},{\"id\":\"2026-exploring-model-welfare\",\"title\":\"Exploring model welfare\",\"url\":\"https://www.anthropic.com/research/exploring-model-welfare\"}],\"body\":\"$14\"},{\"id\":\"Jagged frontier\",\"slug\":\"jagged-frontier\",\"kind\":\"concept\",\"title\":\"Jagged frontier\",\"title_es\":\"Frontera dentada\",\"summary\":\"AI capability is uneven: tasks that look equally hard can fall on opposite sides of an invisible line, and only heavy use shows where it runs. Workers who cannot see the line trust the AI where it fails.\",\"summary_es\":\"La capacidad de la IA es desigual: tareas que parecen igual de difíciles pueden quedar a un lado u otro de una línea invisible, y solo el uso intensivo enseña por dónde pasa. Quien no ve la línea confía en la IA justo donde falla.\",\"region\":\"Power and work\",\"cluster\":\"Work\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Novices or experts\",\"Deskilling\",\"AI and jobs\",\"Tacit knowledge\",\"Cognitive offloading\",\"Ethan Mollick\",\"Cory Doctorow\"],\"positions\":[],\"sources\":[{\"id\":\"2023-centaurs-and-cyborgs-on-the-jagged-frontier\",\"title\":\"Centaurs and Cyborgs on the Jagged Frontier\",\"url\":\"https://www.oneusefulthing.org/p/centaurs-and-cyborgs-on-the-jagged\"},{\"id\":\"2025-pluralistic-the-reverse-centaurs-guide-to-criticizing-ai\",\"title\":\"Daily links from Cory Doctorow\",\"url\":\"https://pluralistic.net/2025/12/05/pop-that-bubble/\"},{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\"},{\"id\":\"2024-2304-11771\",\"title\":\"2304.11771\",\"url\":\"https://arxiv.org/pdf/2304.11771\"},{\"id\":\"2026-no-widespread-displacement-but-the-ai-employment-gap-for-you\",\"title\":\"No Widespread Displacement, but the AI Employment Gap for Young Workers Has Widened to 19%\",\"url\":\"https://digitaleconomy.stanford.edu/news/canariesaug26/\"}],\"body\":\"$15\"},{\"id\":\"Jevons paradox\",\"slug\":\"jevons-paradox\",\"kind\":\"concept\",\"title\":\"Jevons paradox\",\"title_es\":\"Paradoja de Jevons\",\"summary\":\"The 19th-century observation that making a resource more efficient to use can raise total demand for it. Applied to AI, it suggests cheaper work could create more jobs than it destroys.\",\"summary_es\":\"La observación del siglo XIX de que hacer más eficiente el uso de un recurso puede aumentar su demanda total. Aplicada a la IA, sugiere que un trabajo más barato podría crear más empleo del que destruye.\",\"region\":\"Power and work\",\"cluster\":\"Work\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"AI and jobs\",\"Energy per query\",\"Electricity demand forecasts\",\"AI and the energy transition\",\"Erik Brynjolfsson\",\"Dario Amodei\",\"Jonathan Koomey\"],\"positions\":[],\"sources\":[{\"id\":\"2026-wikipedia-jevons-paradox\",\"title\":\"Jevons paradox\",\"url\":\"https://en.wikipedia.org/wiki/Jevons_paradox\"},{\"id\":\"2026-dario-amodei-the-adolescence-of-technology\",\"title\":\"Dario Amodei — The Adolescence of Technology\",\"url\":\"https://darioamodei.com/essay/the-adolescence-of-technology\"},{\"id\":\"2025-bpc-report-electricity-demand-growth-and-data-centers-a-guid\",\"title\":\"BPC-Report-Electricity-Demand-Growth-and-Data-Centers-A-Guide-for-the-Perplexed\",\"url\":\"https://bipartisanpolicy.org/wp-content/uploads/2025/02/BPC-Report-Electricity-Demand-Growth-and-Data-Centers-A-Guide-for-the-Perplexed.pdf\"}],\"body\":\"$16\"},{\"id\":\"Model welfare\",\"slug\":\"model-welfare\",\"kind\":\"concept\",\"title\":\"Model welfare\",\"title_es\":\"Bienestar de los modelos\",\"summary\":\"The question of whether AI models could have experiences that deserve moral consideration. Anthropic opened a research programme on it in 2025 while saying there is no scientific consensus.\",\"summary_es\":\"La cuestión de si los modelos de IA podrían tener experiencias que merezcan consideración moral. Anthropic abrió en 2025 un programa de investigación al respecto, reconociendo que no hay consenso científico.\",\"region\":\"Philosophy\",\"cluster\":\"Consciousness\",\"last_reviewed\":\"2026-09-27\",\"related\":[\"Machine consciousness\",\"Anthropic\",\"Indicator properties\",\"David Chalmers\",\"Patrick Butlin\",\"John Searle\"],\"positions\":[],\"sources\":[{\"id\":\"2026-exploring-model-welfare\",\"title\":\"Exploring model welfare\",\"url\":\"https://www.anthropic.com/research/exploring-model-welfare\"},{\"id\":\"2026-wikipedia-artificial-consciousness\",\"title\":\"Artificial consciousness\",\"url\":\"https://en.wikipedia.org/wiki/Artificial_consciousness\"},{\"id\":\"2024-llm-consciousness-bostonreview\",\"title\":\"llm-consciousness-bostonreview\",\"url\":\"https://arxiv.org/pdf/2303.07103\"},{\"id\":\"2023-consciousness-in-artificial-intelligence-insights-from-the-scie\",\"title\":\"2308.08708\",\"url\":\"https://arxiv.org/pdf/2308.08708\"},{\"id\":\"1980-searle-minds-brains-and-programs\",\"title\":\"searle.minds.brains.programs.bbs.1980\",\"url\":\"https://home.csulb.edu/~cwallis/382/readings/482/searle.minds.brains.programs.bbs.1980.pdf\"},{\"id\":\"2026-iep-artificial-intel
